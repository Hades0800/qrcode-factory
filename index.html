<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="上鎧鋼鐵">
<meta name="theme-color" content="#d23535">
<title>上鎧鋼鐵 - 廠務工單系統</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --brand: #d23535;
    --brand-dark: #a82828;
    --brand-soft: #fdf2f2;
    --ink: #1c1c1e;
    --text: #2c2c2e;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --bg: #f2f2f5;
    --card: #ffffff;
    --success: #2ea043;
    --success-soft: #e6f7ea;
    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  /* Header */
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    padding-top: calc(12px + var(--safe-top));
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  header .brand img {
    height: 32px;
    width: auto;
    flex-shrink: 0;
  }
  header .brand-text {
    border-left: 2px solid var(--border);
    padding-left: 10px;
    line-height: 1.2;
    min-width: 0;
  }
  header .brand-text .title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header .brand-text .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header .right { display: flex; gap: 2px; flex-shrink: 0; }
  header .right a {
    color: var(--brand);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    padding: 8px 10px;
    border-radius: 8px;
    min-height: 36px;
    display: inline-flex;
    align-items: center;
  }
  header .right a:hover { background: var(--brand-soft); }

  .container {
    padding: 14px;
    max-width: 600px;
    margin: 0 auto;
    padding-bottom: calc(120px + var(--safe-bottom));
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.02);
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card h2 .required {
    background: var(--brand);
    color: #fff;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: .5px;
    font-weight: 700;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type=text], input[type=password], textarea {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(210,53,53,.12);
  }
  textarea { min-height: 70px; resize: vertical; }

  button {
    appearance: none;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    padding: 16px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
    transition: transform .08s, opacity .15s, background .15s, box-shadow .15s;
    min-height: 52px;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  .btn-primary {
    background: var(--brand);
    color: #fff;
    box-shadow: 0 4px 12px rgba(210,53,53,.3);
  }
  .btn-primary:hover:not(:disabled) { background: var(--brand-dark); }
  .btn-primary:active { box-shadow: 0 2px 6px rgba(210,53,53,.3); }
  .btn-secondary {
    background: #fff;
    color: var(--ink);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:hover { background: #f7f7f9; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn-danger:hover { background: var(--brand-soft); }
  .btn-block { width: 100%; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  .or-divider {
    display: flex;
    align-items: center;
    margin: 14px 0;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  .or-divider::before, .or-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .or-divider::before { margin-right: 12px; }
  .or-divider::after { margin-left: 12px; }

  /* 工單顯示 */
  .order-display {
    text-align: center;
    padding: 8px 0;
  }
  .order-display .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .order-display .num {
    font-size: 30px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -.5px;
    margin-bottom: 6px;
    word-break: break-all;
    line-height: 1.1;
  }
  .order-display .updated {
    font-size: 12px;
    color: var(--muted);
  }

  /* Steps */
  .step {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    background: #fff;
    transition: all .15s;
    display: flex;
    gap: 14px;
  }
  .step.done {
    background: var(--success-soft);
    border-color: var(--success);
  }
  .step .step-num {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    transition: all .2s;
  }
  .step.done .step-num {
    background: var(--success);
    color: #fff;
  }
  .step .step-body { flex: 1; min-width: 0; }
  .step .title {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .step .hint {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .step .time {
    font-size: 13px;
    color: var(--success);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .step .note-text {
    font-size: 13px;
    color: var(--text);
    background: rgba(255,255,255,.7);
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    word-break: break-all;
    border-left: 3px solid var(--success);
  }
  .step button { font-size: 15px; padding: 13px; min-height: 48px; }

  .badge {
    display: inline-block;
    background: var(--border);
    color: var(--muted);
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-left: 6px;
  }
  .badge.ok { background: var(--success); color: #fff; }

  /* 進度條 */
  .progress-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--brand-soft), #ffffff);
    border-radius: 12px;
    border: 1.5px solid var(--brand-soft);
  }
  .progress-summary .text {
    flex: 1;
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
  }
  .progress-summary .text small {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    margin-top: 2px;
  }
  .progress-summary .count {
    font-size: 24px;
    font-weight: 800;
    color: var(--brand);
    line-height: 1;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 12px;
    grid-column: 1 / -1;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brand), var(--brand-dark));
    border-radius: 3px;
    transition: width .3s;
  }
  .progress-summary { flex-wrap: wrap; }
  .progress-summary .progress-bar { width: 100%; }

  /* Sticky bottom action */
  .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    padding-bottom: calc(12px + var(--safe-bottom));
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
    z-index: 50;
    display: none;
  }
  .bottom-bar.show { display: block; }
  .bottom-bar button {
    width: 100%;
    background: var(--brand);
    color: #fff;
    box-shadow: 0 4px 12px rgba(210,53,53,.3);
    font-size: 16px;
    min-height: 56px;
  }

  /* Scanner Modal */
  #scannerModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.95);
    z-index: 100;
    flex-direction: column;
    padding: 20px;
  }
  #scannerModal.show { display: flex; }
  #scannerModal .modal-title {
    color: #fff;
    font-size: 17px;
    margin-bottom: 14px;
    text-align: center;
    font-weight: 600;
  }
  #qr-reader { width: 100%; max-width: 480px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
  #qr-reader video { border-radius: 12px; }
  #scannerModal .close-btn { margin-top: 16px; max-width: 480px; margin-left: auto; margin-right: auto; width: 100%; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28,28,30,.95);
    color: #fff;
    padding: 14px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    z-index: 200;
    display: none;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  #toast.show { display: block; }
  #toast.error { background: var(--brand); }
  #toast.success { background: var(--success); }

  /* 登入畫面 */
  #loginScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #ffffff 0%, #faf0f0 100%);
    z-index: 300;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #loginScreen.show { display: flex; }
  #loginScreen .logo-area {
    text-align: center;
    margin-bottom: 28px;
  }
  #loginScreen .logo-area img {
    width: 220px;
    max-width: 80vw;
    height: auto;
    margin-bottom: 8px;
  }
  #loginScreen .login-box {
    background: #fff;
    padding: 28px 26px;
    border-radius: 18px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(168,40,40,.12), 0 0 0 1px rgba(0,0,0,.04);
  }
  #loginScreen h2 {
    margin: 0 0 4px;
    font-size: 20px;
    color: var(--ink);
    text-align: center;
    font-weight: 700;
  }
  #loginScreen .login-sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
  }
  #loginScreen label { margin-top: 14px; }
  #loginScreen .login-error {
    color: var(--brand);
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
    text-align: center;
    font-weight: 500;
  }
  #loginScreen .login-btn { margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.jpg" alt="上鎧鋼鐵">
    <div class="brand-text">
      <div class="title">廠務工單系統</div>
      <div class="sub" id="leaderShow">未登入</div>
    </div>
  </div>
  <div class="right">
    <a href="records.html" id="recordsLink" style="display:none;">紀錄</a>
    <a href="#" id="adminLink" style="display:none;">管理</a>
    <a href="#" id="logoutLink" style="display:none;">登出</a>
  </div>
</header>

<div class="container">
  <!-- 工單 -->
  <div class="card">
    <h2>工單號 <span class="required">必填</span></h2>
    <div id="orderEmpty">
      <button class="btn-primary btn-block" id="scanOrderBtn">📷 掃描工單條碼</button>
      <div class="or-divider">或</div>
      <div class="row">
        <input type="text" id="orderInput" placeholder="手動輸入工單號">
        <button class="btn-secondary" id="setOrderBtn" style="flex:0 0 90px;">確定</button>
      </div>
    </div>
    <div id="orderShow" style="display:none;">
      <div class="order-display">
        <div class="label">目前工單</div>
        <div class="num" id="orderNoText"></div>
        <div class="updated" id="orderUpdated"></div>
      </div>
      <button class="btn-secondary btn-block" id="changeOrderBtn" style="margin-top:14px;">更換工單</button>
    </div>
  </div>

  <!-- 機台號（必填） -->
  <div class="card" id="machineCard" style="display:none;">
    <h2>機台號 <span class="required">必填</span></h2>
    <div id="machineEmpty">
      <button class="btn-primary btn-block" id="scanMachineBtn">📷 掃描機台 QR</button>
      <div class="or-divider">或</div>
      <div class="row">
        <input type="text" id="machineInput" placeholder="手動輸入機台號（例：No1）">
        <button class="btn-secondary" id="setMachineBtn" style="flex:0 0 90px;">確定</button>
      </div>
    </div>
    <div id="machineShow" style="display:none;">
      <div class="order-display">
        <div class="label">機台</div>
        <div class="num" id="machineNoText" style="font-size:24px;color:var(--brand);"></div>
      </div>
      <button class="btn-secondary btn-block" id="changeMachineBtn" style="margin-top:14px;">更換機台</button>
    </div>
  </div>

  <!-- 步驟區（動態生成） -->
  <div id="stepsArea" style="display:none;"></div>
</div>

<!-- Sticky 完成送出 -->
<div class="bottom-bar" id="bottomBar">
  <button id="finishBtn">✓ 完成送出，掃下一張工單</button>
</div>

<!-- 掃描 Modal -->
<div id="scannerModal">
  <div class="modal-title" id="scannerTitle">請掃描 QR Code</div>
  <div id="qr-reader"></div>
  <button class="btn-danger close-btn" id="closeScannerBtn">取消</button>
</div>

<!-- 登入畫面 -->
<div id="loginScreen">
  <div class="logo-area">
    <img src="logo.jpg" alt="上鎧鋼鐵 SHANG KAI STEEL">
  </div>
  <div class="login-box">
    <h2>廠務工單系統</h2>
    <div class="login-sub">請使用小組長帳號登入</div>
    <label>帳號</label>
    <input type="text" id="loginUsername" autocomplete="username" autocapitalize="none">
    <label>密碼</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
    <div class="login-error" id="loginError"></div>
    <button class="btn-primary btn-block login-btn" id="loginBtn">登入</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ====== 設定 ======
// 部署 Zeabur 後端後，把 URL 貼這裡
const API_URL = 'https://shangkai-manu-record.zeabur.app';

const STEPS = [
  { id: '1', title: '1. 原料準備與設置',     hint: '', needNote: false },
  { id: '2', title: '2. 模刀具準備與安裝',   hint: '', needNote: false },
  { id: '3', title: '3. 試模與規格品質確認', hint: '', needNote: false },
  { id: '4', title: '4. 斷續試稼生產製造',   hint: '若超過 5 分鐘停滯生產請註明', needNote: true,  noteLabel: '備註（停滯說明）' },
  { id: '5', title: '5. 穩定連續生產製造',   hint: '', needNote: false },
  { id: '6', title: '6. 後工程接續生產',     hint: '軋平、捲網、波浪網等',         needNote: false },
  { id: '7', title: '7. 生產異常或註記事項', hint: '設備故障、模具頓刀、品質異常、清潔清運、包裝入庫等', needNote: true,  noteLabel: '異常 / 註記內容' },
];

const STEP_FIELD = {
  '1': { time: 'step1At', note: null },
  '2': { time: 'step2At', note: null },
  '3': { time: 'step3At', note: null },
  '4': { time: 'step4At', note: 'step4Note' },
  '5': { time: 'step5At', note: null },
  '6': { time: 'step6At', note: null },
  '7': { time: 'step7At', note: 'step7Note' },
};

// ====== State ======
let token = localStorage.getItem('token') || '';
let me = JSON.parse(localStorage.getItem('me') || 'null');
let orderNo = '';
let order = null;
let scanner = null;
let scanMode = null;
let pendingStep = null;

// ====== Helpers ======
function $(id) { return document.getElementById(id); }

function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = '';
  if (type) t.classList.add(type);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function api(path, options = {}) {
  try {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_URL + path, {
      method: options.method || 'GET',
      headers,
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
    let data;
    try { data = await res.json(); }
    catch (e) { return { ok: false, status: res.status, error: '伺服器回應錯誤' }; }
    if (res.status === 401) {
      logout(true);
      return { ok: false, status: 401, error: data.error || '請重新登入' };
    }
    if (!res.ok) return { ok: false, status: res.status, error: data.error || '操作失敗', data };
    return { ok: true, data };
  } catch (err) {
    return { ok: false, error: '網路錯誤：' + (err && err.message ? err.message : err) };
  }
}

// ====== 登入 / 登出 ======
function showLogin(errMsg) {
  $('loginScreen').classList.add('show');
  $('loginError').textContent = errMsg || '';
  $('loginPassword').value = '';
  setTimeout(() => $('loginUsername').focus(), 100);
}
function hideLogin() {
  $('loginScreen').classList.remove('show');
}

async function doLogin() {
  const username = $('loginUsername').value.trim();
  const password = $('loginPassword').value;
  if (!username || !password) {
    $('loginError').textContent = '請輸入帳號密碼';
    return;
  }
  $('loginBtn').disabled = true;
  $('loginError').textContent = '';
  const r = await api('/api/auth/login', { method: 'POST', body: { username, password } });
  $('loginBtn').disabled = false;
  if (!r.ok) {
    $('loginError').textContent = r.error || '登入失敗';
    return;
  }
  token = r.data.token;
  me = r.data.leader;
  localStorage.setItem('token', token);
  localStorage.setItem('me', JSON.stringify(me));
  hideLogin();
  renderHeader();
  toast('登入成功', 'success');
}

function logout(silent) {
  token = '';
  me = null;
  localStorage.removeItem('token');
  localStorage.removeItem('me');
  orderNo = '';
  order = null;
  $('orderEmpty').style.display = 'block';
  $('orderShow').style.display = 'none';
  $('stepsArea').style.display = 'none';
  $('orderInput').value = '';
  $('machineCard').style.display = 'none';
  $('bottomBar').classList.remove('show');
  renderHeader();
  showLogin(silent ? '登入逾期，請重新登入' : '');
}

$('loginBtn').onclick = doLogin;
$('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('loginUsername').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginPassword').focus(); });
$('logoutLink').onclick = e => { e.preventDefault(); if (confirm('確定登出？')) logout(); };

function renderHeader() {
  if (me) {
    $('leaderShow').textContent = '小組長：' + me.displayName + (me.isAdmin ? '（管理員）' : '');
    $('logoutLink').style.display = 'inline';
    $('recordsLink').style.display = 'inline';
    $('adminLink').style.display = me.isAdmin ? 'inline' : 'none';
    $('adminLink').href = 'admin.html';
  } else {
    $('leaderShow').textContent = '未登入';
    $('logoutLink').style.display = 'none';
    $('recordsLink').style.display = 'none';
    $('adminLink').style.display = 'none';
  }
}

// ====== 工單 ======
async function setOrder(no) {
  no = String(no || '').trim();
  if (!no) { toast('工單號不可空白', 'error'); return; }
  const r = await api('/api/orders/' + encodeURIComponent(no));
  if (!r.ok) { toast(r.error, 'error'); return; }
  orderNo = no;
  order = r.data.order;
  $('orderEmpty').style.display = 'none';
  $('orderShow').style.display = 'block';
  $('orderNoText').textContent = no;
  $('orderUpdated').textContent = order.updatedAt ? ('最後更新：' + fmtTime(order.updatedAt)) : '尚未開始';
  renderMachine();
}

$('setOrderBtn').onclick = () => setOrder($('orderInput').value);
$('orderInput').addEventListener('keydown', e => { if (e.key === 'Enter') setOrder($('orderInput').value); });
$('scanOrderBtn').onclick = () => openScanner('order');
$('changeOrderBtn').onclick = () => {
  orderNo = ''; order = null;
  $('orderEmpty').style.display = 'block';
  $('orderShow').style.display = 'none';
  $('orderInput').value = '';
  $('machineCard').style.display = 'none';
  $('stepsArea').style.display = 'none';
  $('bottomBar').classList.remove('show');
};

// ====== 機台 ======
function renderMachine() {
  $('machineCard').style.display = 'block';
  if (order && order.machineNo) {
    $('machineEmpty').style.display = 'none';
    $('machineShow').style.display = 'block';
    $('machineNoText').textContent = order.machineNo;
    renderSteps();
  } else {
    $('machineEmpty').style.display = 'block';
    $('machineShow').style.display = 'none';
    $('stepsArea').style.display = 'none';
    setTimeout(() => $('machineInput').focus(), 100);
  }
}

async function setMachine(no) {
  no = String(no || '').trim();
  if (!no) { toast('機台號不可空白', 'error'); return; }
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/machine', {
    method: 'POST',
    body: { machineNo: no },
  });
  if (!r.ok) { toast(r.error, 'error'); return; }
  order = r.data.order;
  toast('機台已設定：' + no, 'success');
  renderMachine();
}

$('setMachineBtn').onclick = () => setMachine($('machineInput').value);
$('machineInput').addEventListener('keydown', e => { if (e.key === 'Enter') setMachine($('machineInput').value); });
$('scanMachineBtn').onclick = () => openScanner('machine');
$('changeMachineBtn').onclick = () => {
  $('machineEmpty').style.display = 'block';
  $('machineShow').style.display = 'none';
  $('machineInput').value = '';
  $('stepsArea').style.display = 'none';
  setTimeout(() => $('machineInput').focus(), 100);
};

// ====== 步驟渲染 ======
function renderSteps() {
  const area = $('stepsArea');
  area.style.display = 'block';
  area.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'card';

  const doneCount = STEPS.filter(s => order[STEP_FIELD[s.id].time]).length;
  const pct = Math.round(doneCount / STEPS.length * 100);
  wrap.innerHTML = `
    <h2>工項進度</h2>
    <div class="progress-summary">
      <div class="text">
        已完成 ${doneCount} / ${STEPS.length} 項
        <small>掃描對應 QR 即可記錄時間</small>
      </div>
      <div class="count">${pct}%</div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
  `;

  STEPS.forEach(s => {
    const f = STEP_FIELD[s.id];
    const time = order[f.time];
    const note = f.note ? order[f.note] : '';
    const done = !!time;
    const div = document.createElement('div');
    div.className = 'step' + (done ? ' done' : '');
    let body = `<div class="title">${escapeHtml(s.title.replace(/^\d+\.\s*/, ''))}` +
      (done ? '<span class="badge ok">已完成</span>' : '<span class="badge">未完成</span>') +
      '</div>';
    if (s.hint) body += '<div class="hint">' + s.hint + '</div>';
    if (done) {
      body += '<div class="time">✓ ' + fmtTime(time) + '</div>';
      if (note) body += '<div class="note-text">📝 ' + escapeHtml(note) + '</div>';
      body += '<button class="btn-danger btn-block" data-clear="' + s.id + '">取消此項</button>';
    } else {
      body += '<button class="btn-primary btn-block" data-scan="' + s.id + '">📷 掃描完成</button>';
    }
    div.innerHTML = `<div class="step-num">${s.id}</div><div class="step-body">${body}</div>`;
    wrap.appendChild(div);
  });

  area.appendChild(wrap);

  area.querySelectorAll('[data-scan]').forEach(b => {
    b.onclick = () => startStepScan(b.getAttribute('data-scan'));
  });
  area.querySelectorAll('[data-clear]').forEach(b => {
    b.onclick = () => clearStep(b.getAttribute('data-clear'));
  });

  $('bottomBar').classList.add('show');
}

function finishOrder() {
  if (!confirm('確定完成此工單並掃下一張？\n\n（資料已自動儲存，可隨時回頭查看紀錄）')) return;
  orderNo = ''; order = null;
  $('orderEmpty').style.display = 'block';
  $('orderShow').style.display = 'none';
  $('orderInput').value = '';
  $('machineCard').style.display = 'none';
  $('machineEmpty').style.display = 'block';
  $('machineShow').style.display = 'none';
  $('machineInput').value = '';
  $('stepsArea').style.display = 'none';
  $('bottomBar').classList.remove('show');
  toast('已完成，請掃下一張工單', 'success');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => $('orderInput').focus(), 300);
}
$('finishBtn').onclick = finishOrder;

// ====== 步驟操作 ======
function startStepScan(stepId) {
  if (!orderNo) { toast('請先設定工單', 'error'); return; }
  pendingStep = stepId;
  openScanner('step');
}

async function clearStep(stepId) {
  if (!confirm('確定要取消「' + STEPS.find(s => s.id === stepId).title + '」的紀錄嗎？')) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/steps/' + stepId, { method: 'DELETE' });
  if (!r.ok) { toast(r.error, 'error'); return; }
  order = r.data.order;
  $('orderUpdated').textContent = '最後更新：' + fmtTime(order.updatedAt);
  renderSteps();
  toast('已取消紀錄', 'success');
}

async function submitStep(stepId, note) {
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/steps/' + stepId, {
    method: 'POST',
    body: { note: note || '' },
  });
  if (!r.ok) {
    toast(r.error, 'error');
    if (r.data && r.data.order) { order = r.data.order; renderSteps(); }
    return;
  }
  order = r.data.order;
  $('orderUpdated').textContent = '最後更新：' + fmtTime(order.updatedAt);
  renderSteps();
  toast('✓ 已記錄 ' + STEPS.find(s => s.id === stepId).title, 'success');
}

// ====== 掃描器 ======
function openScanner(mode) {
  scanMode = mode;
  const titles = {
    'order': '請對準工單條碼',
    'machine': '請對準機台 QR Code',
    'step': '請掃描工項 QR Code',
  };
  $('scannerTitle').textContent = titles[mode] || '請掃描 QR Code';
  $('scannerModal').classList.add('show');
  if (!scanner) scanner = new Html5Qrcode('qr-reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 260 } },
    onScanSuccess,
    () => {},
  ).catch(err => {
    toast('無法啟動相機：' + err, 'error');
    closeScanner();
  });
}

async function closeScanner() {
  $('scannerModal').classList.remove('show');
  if (scanner) {
    try { await scanner.stop(); } catch (e) {}
  }
}
$('closeScannerBtn').onclick = closeScanner;

async function onScanSuccess(decodedText) {
  if (scanMode === 'order') {
    await closeScanner();
    let raw = String(decodedText || '').trim();
    let extracted = raw;
    try {
      if (/^https?:\/\//i.test(raw)) {
        const u = new URL(raw);
        const q = u.searchParams;
        extracted = q.get('order') || q.get('orderNo') || q.get('no') || q.get('id') ||
                    u.pathname.split('/').filter(Boolean).pop() || raw;
      }
    } catch (e) {}
    $('orderInput').value = extracted;
    toast('掃到：' + raw.slice(0, 40) + (raw.length > 40 ? '…' : '') + '，請確認後按確定', 'success');
    $('orderInput').focus();
    return;
  }

  if (scanMode === 'machine') {
    await closeScanner();
    let raw = String(decodedText || '').trim();
    let extracted = raw;
    try {
      if (/^https?:\/\//i.test(raw)) {
        const u = new URL(raw);
        extracted = u.searchParams.get('machine') || u.pathname.split('/').filter(Boolean).pop() || raw;
      }
    } catch (e) {}
    $('machineInput').value = extracted;
    toast('掃到：' + raw.slice(0, 40) + (raw.length > 40 ? '…' : '') + '，請確認後按確定', 'success');
    $('machineInput').focus();
    return;
  }

  // step 模式
  const m = String(decodedText).match(/^STEP[:\-]?(\d)$/i);
  if (!m) { toast('不是工項 QR：' + decodedText, 'error'); return; }
  const scanned = m[1];
  if (scanned !== pendingStep) {
    toast('掃到的是項目 ' + scanned + '，但你選的是項目 ' + pendingStep, 'error');
    return;
  }
  await closeScanner();

  // 工項全部非必填 — 4/7 仍提供備註輸入但可留白，不再彈確認框
  const stepDef = STEPS.find(s => s.id === pendingStep);
  let note = '';
  if (stepDef.needNote) {
    note = prompt(stepDef.noteLabel + '（可留白）：', '') || '';
  }
  await submitStep(pendingStep, note);
  pendingStep = null;
}

// ====== 啟動 ======
renderHeader();
if (API_URL.startsWith('PASTE_')) {
  toast('尚未設定 API_URL，請先部署後端', 'error');
} else if (!token) {
  showLogin();
}
</script>
</body>
</html>
