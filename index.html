<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>廠務工單進度</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "Microsoft JhengHei", sans-serif;
    background: #f4f6f8;
    color: #222;
    padding-bottom: 40px;
  }
  header {
    background: #1f3a5f;
    color: #fff;
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 17px; }
  header .sub { font-size: 12px; opacity: .85; margin-top: 2px; }
  header .right { font-size: 12px; }
  header .right a { color: #fff; opacity: .9; text-decoration: none; margin-left: 8px; }

  .container { padding: 14px; max-width: 600px; margin: 0 auto; }

  .card {
    background: #fff;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 { margin: 0 0 10px; font-size: 15px; color: #1f3a5f; }

  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input[type=text], input[type=password], textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #cfd4da;
    border-radius: 6px;
    background: #fff;
  }
  textarea { min-height: 70px; resize: vertical; }

  button {
    appearance: none;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    padding: 11px 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: #1f6feb; color: #fff; }
  .btn-primary:disabled { background: #9ab8e0; }
  .btn-secondary { background: #6c757d; color: #fff; }
  .btn-success { background: #2ea043; color: #fff; }
  .btn-danger { background: #d73a49; color: #fff; }
  .btn-block { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  .step {
    border: 1px solid #e1e4e8;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fff;
  }
  .step.done { background: #e6f7ea; border-color: #2ea043; }
  .step .title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .step .hint { font-size: 12px; color: #666; margin-bottom: 8px; }
  .step .time { font-size: 13px; color: #2ea043; font-weight: 600; margin-bottom: 8px; }
  .step .note-text { font-size: 13px; color: #555; background: #f6f8fa; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; word-break: break-all; }

  #scannerModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 100;
    flex-direction: column;
    padding: 16px;
  }
  #scannerModal.show { display: flex; }
  #scannerModal .modal-title { color: #fff; font-size: 16px; margin-bottom: 10px; text-align: center; }
  #qr-reader { width: 100%; max-width: 480px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden; }
  #qr-reader video { border-radius: 8px; }
  #scannerModal .close-btn { margin-top: 14px; }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 200;
    display: none;
    max-width: 90%;
    text-align: center;
  }
  #toast.show { display: block; }
  #toast.error { background: #d73a49; }
  #toast.success { background: #2ea043; }

  .badge {
    display: inline-block;
    background: #e1e4e8;
    color: #444;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
  }
  .badge.ok { background: #2ea043; color: #fff; }

  /* 登入畫面 */
  #loginScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #1f3a5f, #2c5a8e);
    z-index: 300;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #loginScreen.show { display: flex; }
  #loginScreen .login-box {
    background: #fff;
    padding: 28px 24px;
    border-radius: 12px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
  }
  #loginScreen h2 { margin: 0 0 4px; font-size: 20px; color: #1f3a5f; text-align: center; }
  #loginScreen .login-sub { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
  #loginScreen label { margin-top: 10px; }
  #loginScreen .login-error { color: #d73a49; font-size: 13px; margin-top: 12px; min-height: 18px; text-align: center; }
  #loginScreen .login-btn { margin-top: 16px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>廠務工單進度</h1>
    <div class="sub" id="leaderShow">未登入</div>
  </div>
  <div class="right">
    <a href="#" id="adminLink" style="display:none;">管理</a>
    <a href="#" id="logoutLink" style="display:none;">登出</a>
  </div>
</header>

<div class="container">
  <!-- 工單 -->
  <div class="card">
    <h2>工單號</h2>
    <div id="orderEmpty">
      <button class="btn-primary btn-block" id="scanOrderBtn">掃描工單條碼</button>
      <div style="text-align:center;margin:8px 0;color:#888;font-size:12px;">或</div>
      <div class="row">
        <input type="text" id="orderInput" placeholder="手動輸入工單號">
        <button class="btn-secondary" id="setOrderBtn" style="flex:0 0 80px;">確定</button>
      </div>
    </div>
    <div id="orderShow" style="display:none;">
      <div style="font-size:20px;font-weight:700;color:#1f3a5f;" id="orderNoText"></div>
      <div style="font-size:12px;color:#666;margin-top:4px;" id="orderUpdated"></div>
      <button class="btn-secondary btn-block" id="changeOrderBtn" style="margin-top:10px;">更換工單</button>
    </div>
  </div>

  <!-- 步驟區（動態生成） -->
  <div id="stepsArea" style="display:none;"></div>
</div>

<!-- 掃描 Modal -->
<div id="scannerModal">
  <div class="modal-title" id="scannerTitle">請掃描 QR Code</div>
  <div id="qr-reader"></div>
  <button class="btn-danger close-btn" id="closeScannerBtn">取消</button>
</div>

<!-- 登入畫面 -->
<div id="loginScreen">
  <div class="login-box">
    <h2>廠務工單系統</h2>
    <div class="login-sub">請使用小組長帳號登入</div>
    <label>帳號</label>
    <input type="text" id="loginUsername" autocomplete="username" autocapitalize="none">
    <label>密碼</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
    <div class="login-error" id="loginError"></div>
    <button class="btn-primary btn-block login-btn" id="loginBtn">登入</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ====== 設定 ======
// 部署 Zeabur 後端後，把 URL 貼這裡
const API_URL = 'PASTE_YOUR_ZEABUR_BACKEND_URL_HERE';

const STEPS = [
  { id: '1', title: '1. 原料準備與設置',     hint: '', needNote: false },
  { id: '2', title: '2. 模刀具準備與安裝',   hint: '', needNote: false },
  { id: '3', title: '3. 試模與規格品質確認', hint: '', needNote: false },
  { id: '4', title: '4. 斷續試稼生產製造',   hint: '若超過 5 分鐘停滯生產請註明', needNote: true,  noteLabel: '備註（停滯說明）' },
  { id: '5', title: '5. 穩定連續生產製造',   hint: '', needNote: false },
  { id: '6', title: '6. 後工程接續生產',     hint: '軋平、捲網、波浪網等',         needNote: false },
  { id: '7', title: '7. 生產異常或註記事項', hint: '設備故障、模具頓刀、品質異常、清潔清運、包裝入庫等', needNote: true,  noteLabel: '異常 / 註記內容' },
];

const STEP_FIELD = {
  '1': { time: 'step1At', note: null },
  '2': { time: 'step2At', note: null },
  '3': { time: 'step3At', note: null },
  '4': { time: 'step4At', note: 'step4Note' },
  '5': { time: 'step5At', note: null },
  '6': { time: 'step6At', note: null },
  '7': { time: 'step7At', note: 'step7Note' },
};

// ====== State ======
let token = localStorage.getItem('token') || '';
let me = JSON.parse(localStorage.getItem('me') || 'null');
let orderNo = '';
let order = null;
let scanner = null;
let scanMode = null;
let pendingStep = null;

// ====== Helpers ======
function $(id) { return document.getElementById(id); }

function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = '';
  if (type) t.classList.add(type);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function api(path, options = {}) {
  try {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_URL + path, {
      method: options.method || 'GET',
      headers,
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
    let data;
    try { data = await res.json(); }
    catch (e) { return { ok: false, status: res.status, error: '伺服器回應錯誤' }; }
    if (res.status === 401) {
      logout(true);
      return { ok: false, status: 401, error: data.error || '請重新登入' };
    }
    if (!res.ok) return { ok: false, status: res.status, error: data.error || '操作失敗', data };
    return { ok: true, data };
  } catch (err) {
    return { ok: false, error: '網路錯誤：' + (err && err.message ? err.message : err) };
  }
}

// ====== 登入 / 登出 ======
function showLogin(errMsg) {
  $('loginScreen').classList.add('show');
  $('loginError').textContent = errMsg || '';
  $('loginPassword').value = '';
  setTimeout(() => $('loginUsername').focus(), 100);
}
function hideLogin() {
  $('loginScreen').classList.remove('show');
}

async function doLogin() {
  const username = $('loginUsername').value.trim();
  const password = $('loginPassword').value;
  if (!username || !password) {
    $('loginError').textContent = '請輸入帳號密碼';
    return;
  }
  $('loginBtn').disabled = true;
  $('loginError').textContent = '';
  const r = await api('/api/auth/login', { method: 'POST', body: { username, password } });
  $('loginBtn').disabled = false;
  if (!r.ok) {
    $('loginError').textContent = r.error || '登入失敗';
    return;
  }
  token = r.data.token;
  me = r.data.leader;
  localStorage.setItem('token', token);
  localStorage.setItem('me', JSON.stringify(me));
  hideLogin();
  renderHeader();
  toast('登入成功', 'success');
}

function logout(silent) {
  token = '';
  me = null;
  localStorage.removeItem('token');
  localStorage.removeItem('me');
  orderNo = '';
  order = null;
  $('orderEmpty').style.display = 'block';
  $('orderShow').style.display = 'none';
  $('stepsArea').style.display = 'none';
  $('orderInput').value = '';
  renderHeader();
  showLogin(silent ? '登入逾期，請重新登入' : '');
}

$('loginBtn').onclick = doLogin;
$('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('loginUsername').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginPassword').focus(); });
$('logoutLink').onclick = e => { e.preventDefault(); if (confirm('確定登出？')) logout(); };

function renderHeader() {
  if (me) {
    $('leaderShow').textContent = '小組長：' + me.displayName + (me.isAdmin ? '（管理員）' : '');
    $('logoutLink').style.display = 'inline';
    $('adminLink').style.display = me.isAdmin ? 'inline' : 'none';
    $('adminLink').href = 'admin.html';
  } else {
    $('leaderShow').textContent = '未登入';
    $('logoutLink').style.display = 'none';
    $('adminLink').style.display = 'none';
  }
}

// ====== 工單 ======
async function setOrder(no) {
  no = String(no || '').trim();
  if (!no) { toast('工單號不可空白', 'error'); return; }
  const r = await api('/api/orders/' + encodeURIComponent(no));
  if (!r.ok) { toast(r.error, 'error'); return; }
  orderNo = no;
  order = r.data.order;
  $('orderEmpty').style.display = 'none';
  $('orderShow').style.display = 'block';
  $('orderNoText').textContent = no;
  $('orderUpdated').textContent = order.updatedAt ? ('最後更新：' + fmtTime(order.updatedAt)) : '尚未開始';
  renderSteps();
}

$('setOrderBtn').onclick = () => setOrder($('orderInput').value);
$('orderInput').addEventListener('keydown', e => { if (e.key === 'Enter') setOrder($('orderInput').value); });
$('scanOrderBtn').onclick = () => openScanner('order');
$('changeOrderBtn').onclick = () => {
  orderNo = ''; order = null;
  $('orderEmpty').style.display = 'block';
  $('orderShow').style.display = 'none';
  $('orderInput').value = '';
  $('stepsArea').style.display = 'none';
};

// ====== 步驟渲染 ======
function renderSteps() {
  const area = $('stepsArea');
  area.style.display = 'block';
  area.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = '<h2>工項進度（每項只能掃一次）</h2>';

  STEPS.forEach(s => {
    const f = STEP_FIELD[s.id];
    const time = order[f.time];
    const note = f.note ? order[f.note] : '';
    const done = !!time;
    const div = document.createElement('div');
    div.className = 'step' + (done ? ' done' : '');
    let html = '<div class="title">' + s.title +
      (done ? '<span class="badge ok">已完成</span>' : '<span class="badge">未完成</span>') + '</div>';
    if (s.hint) html += '<div class="hint">' + s.hint + '</div>';
    if (done) {
      html += '<div class="time">✓ ' + fmtTime(time) + '</div>';
      if (note) html += '<div class="note-text">📝 ' + escapeHtml(note) + '</div>';
      html += '<button class="btn-danger btn-block" data-clear="' + s.id + '">取消此項紀錄</button>';
    } else {
      html += '<button class="btn-primary btn-block" data-scan="' + s.id + '">掃描完成此項</button>';
    }
    div.innerHTML = html;
    wrap.appendChild(div);
  });

  area.appendChild(wrap);
  area.querySelectorAll('[data-scan]').forEach(b => {
    b.onclick = () => startStepScan(b.getAttribute('data-scan'));
  });
  area.querySelectorAll('[data-clear]').forEach(b => {
    b.onclick = () => clearStep(b.getAttribute('data-clear'));
  });
}

// ====== 步驟操作 ======
function startStepScan(stepId) {
  if (!orderNo) { toast('請先設定工單', 'error'); return; }
  pendingStep = stepId;
  openScanner('step');
}

async function clearStep(stepId) {
  if (!confirm('確定要取消「' + STEPS.find(s => s.id === stepId).title + '」的紀錄嗎？')) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/steps/' + stepId, { method: 'DELETE' });
  if (!r.ok) { toast(r.error, 'error'); return; }
  order = r.data.order;
  $('orderUpdated').textContent = '最後更新：' + fmtTime(order.updatedAt);
  renderSteps();
  toast('已取消紀錄', 'success');
}

async function submitStep(stepId, note) {
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/steps/' + stepId, {
    method: 'POST',
    body: { note: note || '' },
  });
  if (!r.ok) {
    toast(r.error, 'error');
    if (r.data && r.data.order) { order = r.data.order; renderSteps(); }
    return;
  }
  order = r.data.order;
  $('orderUpdated').textContent = '最後更新：' + fmtTime(order.updatedAt);
  renderSteps();
  toast('✓ 已記錄 ' + STEPS.find(s => s.id === stepId).title, 'success');
}

// ====== 掃描器 ======
function openScanner(mode) {
  scanMode = mode;
  $('scannerTitle').textContent = mode === 'order' ? '請對準工單條碼' : '請掃描工項 QR Code';
  $('scannerModal').classList.add('show');
  if (!scanner) scanner = new Html5Qrcode('qr-reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 260 } },
    onScanSuccess,
    () => {},
  ).catch(err => {
    toast('無法啟動相機：' + err, 'error');
    closeScanner();
  });
}

async function closeScanner() {
  $('scannerModal').classList.remove('show');
  if (scanner) {
    try { await scanner.stop(); } catch (e) {}
  }
}
$('closeScannerBtn').onclick = closeScanner;

async function onScanSuccess(decodedText) {
  if (scanMode === 'order') {
    await closeScanner();
    let raw = String(decodedText || '').trim();
    let extracted = raw;
    try {
      if (/^https?:\/\//i.test(raw)) {
        const u = new URL(raw);
        const q = u.searchParams;
        extracted = q.get('order') || q.get('orderNo') || q.get('no') || q.get('id') ||
                    u.pathname.split('/').filter(Boolean).pop() || raw;
      }
    } catch (e) {}
    $('orderInput').value = extracted;
    toast('掃到：' + raw.slice(0, 40) + (raw.length > 40 ? '…' : '') + '，請確認後按確定', 'success');
    $('orderInput').focus();
    return;
  }

  // step 模式
  const m = String(decodedText).match(/^STEP[:\-]?(\d)$/i);
  if (!m) { toast('不是工項 QR：' + decodedText, 'error'); return; }
  const scanned = m[1];
  if (scanned !== pendingStep) {
    toast('掃到的是項目 ' + scanned + '，但你選的是項目 ' + pendingStep, 'error');
    return;
  }
  await closeScanner();

  const stepDef = STEPS.find(s => s.id === pendingStep);
  let note = '';
  if (stepDef.needNote) {
    note = prompt(stepDef.noteLabel + '：', '') || '';
    if (!note.trim()) {
      if (!confirm('沒有填寫備註，仍要記錄嗎？')) return;
    }
  }
  await submitStep(pendingStep, note);
  pendingStep = null;
}

// ====== 啟動 ======
renderHeader();
if (API_URL.startsWith('PASTE_')) {
  toast('尚未設定 API_URL，請先部署後端', 'error');
} else if (!token) {
  showLogin();
}
</script>
</body>
</html>
