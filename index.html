<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(), geolocation=()">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="上鎧鋼鐵">
<meta name="theme-color" content="#d23535">
<title>上鎧鋼鐵 - 廠務工單系統</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --brand: #d23535;
    --brand-dark: #a82828;
    --brand-soft: #fdf2f2;
    --ink: #1c1c1e;
    --text: #2c2c2e;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --bg: #f2f2f5;
    --card: #ffffff;
    --success: #2ea043;
    --success-soft: #e6f7ea;
    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }

  /* Header */
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    padding-top: calc(12px + var(--safe-top));
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  header .brand img {
    height: 32px;
    width: auto;
    flex-shrink: 0;
  }
  header .brand-text {
    border-left: 2px solid var(--border);
    padding-left: 10px;
    line-height: 1.2;
    min-width: 0;
  }
  header .brand-text .title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header .brand-text .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .menu-toggle {
    background: none; border: none; font-size: 22px; color: var(--ink);
    cursor: pointer; padding: 6px 10px; border-radius: 8px;
    min-height: 36px; display: flex; align-items: center; flex-shrink: 0;
  }
  .menu-toggle:hover { background: var(--bg); }
  .dropdown-menu {
    display: none; position: fixed; top: 56px; right: 8px;
    background: #fff; border-radius: 12px; min-width: 170px; z-index: 999; padding: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);
    animation: menuIn .15s ease;
  }
  .dropdown-menu.show { display: block; }
  @keyframes menuIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
  .dropdown-menu a {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    font-size: 15px; font-weight: 600; color: var(--text);
    text-decoration: none; border-radius: 8px;
  }
  .dropdown-menu a:hover { background: var(--bg); }
  .dropdown-menu a.nav-active { color: var(--brand); background: var(--brand-soft); }
  .dropdown-menu .menu-sep { height: 1px; background: var(--border); margin: 4px 8px; }
  .dropdown-menu a.menu-logout { color: var(--muted); }

  .container {
    padding: 14px;
    max-width: 600px;
    margin: 0 auto;
    padding-bottom: calc(120px + var(--safe-bottom));
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.02);
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card h2 .required {
    background: var(--brand);
    color: #fff;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 10px;
    letter-spacing: .5px;
    font-weight: 700;
  }

  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 500;
  }
  input[type=text], input[type=password], textarea {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    background: #fff;
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type=text]:focus, input[type=password]:focus, textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(210,53,53,.12);
  }
  textarea { min-height: 70px; resize: vertical; }

  button {
    appearance: none;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    padding: 16px;
    cursor: pointer;
    font-weight: 700;
    font-family: inherit;
    transition: transform .08s, opacity .15s, background .15s, box-shadow .15s;
    min-height: 52px;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; }
  .btn-primary {
    background: var(--brand);
    color: #fff;
    box-shadow: 0 4px 12px rgba(210,53,53,.3);
  }
  .btn-primary:hover:not(:disabled) { background: var(--brand-dark); }
  .btn-primary:active { box-shadow: 0 2px 6px rgba(210,53,53,.3); }
  .btn-secondary {
    background: #fff;
    color: var(--ink);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:hover { background: #f7f7f9; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-danger { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn-danger:hover { background: var(--brand-soft); }
  .btn-block { width: 100%; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  /* 機台按鈕格 */
  .machine-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .machine-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 8px;
    min-height: 80px;
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .machine-btn:active { transform: scale(.96); }
  .machine-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
  .machine-btn .m-num { font-size: 20px; font-weight: 800; color: var(--brand); }
  .machine-btn .m-spec { font-size: 13px; color: var(--muted); margin-top: 2px; font-weight: 600; }
  .machine-btn.selected {
    border-color: var(--brand);
    background: var(--brand);
    box-shadow: 0 4px 12px rgba(210,53,53,.3);
  }
  .machine-btn.selected .m-num { color: #fff; }
  .machine-btn.selected .m-spec { color: rgba(255,255,255,.85); }
  .machine-btn.disabled {
    background: #e5e5ea;
    border-color: #d1d1d6;
    cursor: not-allowed;
    opacity: .6;
  }
  .machine-btn.disabled .m-num { color: #8e8e93; }
  .machine-btn.disabled .m-spec { color: #aeaeb2; }
  .machine-btn.disabled:hover { background: #e5e5ea; border-color: #d1d1d6; }
  .machine-btn .m-tag {
    font-size: 9px;
    color: #8e8e93;
    background: #fff;
    padding: 1px 6px;
    border-radius: 8px;
    margin-top: 4px;
    font-weight: 600;
  }

  /* 底部動作按鈕 */
  .action-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    min-height: 60px;
    transition: all .15s;
  }
  .action-btn:active { transform: scale(.98); }
  .action-btn .act-icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
  }
  .action-btn .act-body { flex: 1; min-width: 0; }
  .action-btn .act-title { font-size: 15px; font-weight: 700; }
  .action-btn .act-hint { font-size: 11px; opacity: .8; margin-top: 2px; line-height: 1.3; }
  .action-btn.act-success { background: var(--success); color: #fff; box-shadow: 0 4px 12px rgba(46,160,67,.3); }
  .action-btn.act-success .act-icon { background: rgba(255,255,255,.2); }
  .action-btn.act-warning { background: #f0ad4e; color: #fff; box-shadow: 0 4px 12px rgba(240,173,78,.3); }
  .action-btn.act-warning .act-icon { background: rgba(255,255,255,.2); }
  .action-btn.act-danger { background: var(--brand); color: #fff; box-shadow: 0 4px 12px rgba(210,53,53,.3); }
  .action-btn.act-danger .act-icon { background: rgba(255,255,255,.2); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .75; }
  }

  .or-divider {
    display: flex;
    align-items: center;
    margin: 14px 0;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  .or-divider::before, .or-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .or-divider::before { margin-right: 12px; }
  .or-divider::after { margin-left: 12px; }

  /* 工單顯示 */
  .order-display {
    text-align: center;
    padding: 8px 0;
  }
  .order-display .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .order-display .num {
    font-size: 30px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -.5px;
    margin-bottom: 6px;
    word-break: break-all;
    line-height: 1.1;
  }
  .order-display .updated {
    font-size: 12px;
    color: var(--muted);
  }

  /* Steps */
  .step {
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    background: #fff;
    transition: all .15s;
    display: flex;
    gap: 14px;
  }
  .step.done {
    background: var(--success-soft);
    border-color: var(--success);
  }
  .step .step-num {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 800;
    transition: all .2s;
  }
  .step.done .step-num {
    background: var(--success);
    color: #fff;
  }
  .step .step-body { flex: 1; min-width: 0; }
  .step .title {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .step .hint {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .step .time {
    font-size: 13px;
    color: var(--success);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .step .note-text {
    font-size: 13px;
    color: var(--text);
    background: rgba(255,255,255,.7);
    padding: 8px 10px;
    border-radius: 8px;
    margin-bottom: 10px;
    word-break: break-all;
    border-left: 3px solid var(--success);
  }
  .step button { font-size: 15px; padding: 13px; min-height: 48px; }
  .step-actions { display: flex; gap: 8px; }
  .step-actions .btn-primary { flex: 1; }
  .step-actions .btn-success { flex: 0 0 auto; padding: 13px 18px; background: var(--success); color: #fff; box-shadow: 0 2px 6px rgba(46,160,67,.25); }

  .badge {
    display: inline-block;
    background: var(--border);
    color: var(--muted);
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-left: 6px;
  }
  .badge.ok { background: var(--success); color: #fff; }

  /* 進度條 */
  .progress-summary {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding: 14px 16px;
    background: linear-gradient(135deg, var(--brand-soft), #ffffff);
    border-radius: 12px;
    border: 1.5px solid var(--brand-soft);
  }
  .progress-summary .text {
    flex: 1;
    font-size: 13px;
    color: var(--ink);
    font-weight: 600;
  }
  .progress-summary .text small {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    margin-top: 2px;
  }
  .progress-summary .count {
    font-size: 24px;
    font-weight: 800;
    color: var(--brand);
    line-height: 1;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 12px;
    grid-column: 1 / -1;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brand), var(--brand-dark));
    border-radius: 3px;
    transition: width .3s;
  }
  .progress-summary { flex-wrap: wrap; }
  .progress-summary .progress-bar { width: 100%; }

  /* Sticky bottom action */
  .bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #fff;
    border-top: 1px solid var(--border);
    padding: 12px 14px;
    padding-bottom: calc(12px + var(--safe-bottom));
    box-shadow: 0 -4px 16px rgba(0,0,0,.06);
    z-index: 50;
    display: none;
  }
  .bottom-bar.show { display: block; }
  .bottom-bar button {
    width: 100%;
    background: var(--brand);
    color: #fff;
    box-shadow: 0 4px 12px rgba(210,53,53,.3);
    font-size: 16px;
    min-height: 56px;
  }

  /* Scanner Modal */
  #scannerModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.95);
    z-index: 100;
    flex-direction: column;
    padding: 20px;
  }
  #scannerModal.show { display: flex; }
  #scannerModal .modal-title {
    color: #fff;
    font-size: 17px;
    margin-bottom: 14px;
    text-align: center;
    font-weight: 600;
  }
  #qr-reader { width: 100%; max-width: 480px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; }
  #qr-reader video { border-radius: 12px; }
  #scannerModal .close-btn { margin-top: 16px; max-width: 480px; margin-left: auto; margin-right: auto; width: 100%; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28,28,30,.95);
    color: #fff;
    padding: 14px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    z-index: 200;
    display: none;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  #toast.show { display: block; }
  #toast.error { background: var(--brand); }
  #toast.success { background: var(--success); }

  /* 登入畫面 */
  #loginScreen {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #ffffff 0%, #faf0f0 100%);
    z-index: 300;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #loginScreen.show { display: flex; }
  #loginScreen .logo-area {
    text-align: center;
    margin-bottom: 28px;
  }
  #loginScreen .logo-area img {
    width: 220px;
    max-width: 80vw;
    height: auto;
    margin-bottom: 8px;
  }
  #loginScreen .login-box {
    background: #fff;
    padding: 28px 26px;
    border-radius: 18px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(168,40,40,.12), 0 0 0 1px rgba(0,0,0,.04);
  }
  #loginScreen h2 {
    margin: 0 0 4px;
    font-size: 20px;
    color: var(--ink);
    text-align: center;
    font-weight: 700;
  }
  #loginScreen .login-sub {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
  }
  #loginScreen label { margin-top: 14px; }
  #loginScreen .login-error {
    color: var(--brand);
    font-size: 13px;
    margin-top: 14px;
    min-height: 18px;
    text-align: center;
    font-weight: 500;
  }
  #loginScreen .login-btn { margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.jpg" alt="上鎧鋼鐵">
    <div class="brand-text">
      <div class="title">廠務工單系統</div>
      <div class="sub" id="leaderShow">未登入</div>
    </div>
  </div>
  <button class="menu-toggle" id="menuBtn" style="display:none;" onclick="$('dropMenu').classList.toggle('show')">☰</button>
  <div class="dropdown-menu" id="dropMenu">
    <a href="index.html" class="nav-active">📷 掃描</a>
    <a href="records.html">📊 紀錄</a>
    <a href="realtime.html">⚡ 即時</a>
    <a href="upload.html" id="uploadLink" style="display:none;">📤 上傳</a>
    <a href="admin.html" id="adminLink" style="display:none;">⚙ 管理</a>
    <div class="menu-sep"></div>
    <a href="#" id="logoutLink" class="menu-logout">登出</a>
  </div>
</header>

<div class="container">
  <!-- 機台選擇（第一步） -->
  <div class="card" id="machineCard">
    <h2>選擇機台 <span class="required">第一步</span></h2>
    <div id="machineEmpty">
      <div class="machine-grid">
        <button class="machine-btn" data-machine="No1-350"><span class="m-num">No1</span><span class="m-spec">350</span></button>
        <button class="machine-btn" data-machine="No2-250"><span class="m-num">No2</span><span class="m-spec">250</span></button>
        <button class="machine-btn" data-machine="No3-60"><span class="m-num">No3</span><span class="m-spec">60</span></button>
        <button class="machine-btn" data-machine="No4-90"><span class="m-num">No4</span><span class="m-spec">90</span></button>
        <button class="machine-btn" data-machine="No5-40"><span class="m-num">No5</span><span class="m-spec">40</span></button>
        <button class="machine-btn" data-machine="No6-40"><span class="m-num">No6</span><span class="m-spec">40</span></button>
      </div>
    </div>
    <div id="machineShow" style="display:none;">
      <div class="order-display">
        <div class="label">機台</div>
        <div class="num" id="machineNoText" style="font-size:24px;color:var(--brand);"></div>
      </div>
      <button class="btn-secondary btn-block" id="changeMachineBtn" style="margin-top:14px;">更換機台</button>
    </div>
  </div>

  <!-- 工單號（第二步） -->
  <div class="card" id="orderCard" style="display:none;">
    <h2>工單號 <span class="required">第二步</span></h2>
    <div id="orderEmpty">
      <button class="btn-primary btn-block" id="scanOrderBtn">📷 掃描工單條碼</button>
      <div class="or-divider">或</div>
      <div class="row">
        <input type="text" id="orderInput" placeholder="手動輸入工單號">
        <button class="btn-secondary" id="setOrderBtn" style="flex:0 0 90px;">確定</button>
      </div>
      <div class="or-divider">或</div>
      <button class="btn-block" id="idleBtn" style="background:#6e6e73;color:#fff;box-shadow:0 2px 6px rgba(110,110,115,.25);">
        🛑 生產無工令
        <div style="font-size:11px;font-weight:500;margin-top:2px;opacity:.85;">設備無稼動</div>
      </button>
    </div>
    <div id="orderShow" style="display:none;">
      <div class="order-display">
        <div class="label">目前工單</div>
        <div class="num" id="orderNoText"></div>
        <div class="updated" id="orderUpdated"></div>
      </div>
      <button class="btn-secondary btn-block" id="changeOrderBtn" style="margin-top:14px;">更換工單</button>
    </div>
  </div>

  <!-- 步驟區（動態生成） -->
  <div id="stepsArea" style="display:none;"></div>
</div>

<!-- Sticky 完成送出 -->
<div class="bottom-bar" id="bottomBar">
  <button id="finishBtn">✓ 完成送出，掃下一張工單</button>
</div>

<!-- 掃描 Modal -->
<div id="scannerModal">
  <div class="modal-title" id="scannerTitle">請掃描 QR Code</div>
  <div id="qr-reader"></div>
  <div id="cameraError" style="display:none;color:#fff;text-align:center;padding:20px;background:rgba(255,255,255,.08);border-radius:12px;max-width:480px;margin:0 auto;">
    <div style="font-size:40px;margin-bottom:10px;">📷❌</div>
    <div style="font-size:16px;font-weight:700;margin-bottom:8px;">無法開啟相機</div>
    <div id="cameraErrorMsg" style="font-size:13px;opacity:.85;margin-bottom:14px;line-height:1.5;"></div>
    <div style="font-size:12px;opacity:.7;text-align:left;background:rgba(0,0,0,.3);padding:12px;border-radius:8px;line-height:1.6;">
      <strong>請檢查：</strong><br>
      1. 瀏覽器是否允許使用相機<br>
      2. iPhone：設定 → Safari → 相機 → 允許<br>
      3. Android：設定 → 應用程式 → 瀏覽器 → 權限 → 相機<br>
      4. 沒有其他 App 正在用相機<br>
      5. 改用「手動輸入」也可以
    </div>
  </div>
  <button class="btn-danger close-btn" id="closeScannerBtn">關閉，改用手動輸入</button>
</div>

<!-- 登入畫面 -->
<div id="loginScreen">
  <div class="logo-area">
    <img src="logo.jpg" alt="上鎧鋼鐵 SHANG KAI STEEL">
  </div>
  <div class="login-box">
    <h2>廠務工單系統</h2>
    <div class="login-sub">請使用小組長帳號登入</div>
    <label>帳號</label>
    <input type="text" id="loginUsername" autocomplete="username" autocapitalize="none">
    <label>密碼</label>
    <input type="password" id="loginPassword" autocomplete="current-password">
    <div class="login-error" id="loginError"></div>
    <button class="btn-primary btn-block login-btn" id="loginBtn">登入</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ====== 設定 ======
// 部署 Zeabur 後端後，把 URL 貼這裡
const API_URL = 'https://shangkai-manu-record.zeabur.app';

const STEPS = [
  { id: '1', title: '01. 原料準備與設置',     hint: '' },
  { id: '2', title: '02. 模刀具準備與安裝',   hint: '' },
  { id: '3', title: '03. 試模與規格品質確認', hint: '' },
  { id: '4', title: '04. 斷續試稼生產製造',   hint: '無法連續生產3分鐘' },
  { id: '5', title: '05. 穩定連續生產製造',   hint: '' },
  { id: '6', title: '06. 後工程接續生產',     hint: '軋平、捲網、波浪網等' },
  { id: '7', title: '07. 其他作業',           hint: '清潔清運或包裝入庫等' },
];

const ACTIONS_FINISH = { id: '11', title: '工單完成與結束', hint: '開始新的製造工單', style: 'act-success', icon: '✓' };
const PAUSE_TYPES = [
  { type: '12', title: '生產正常暫停稼動', hint: '休息時間、人力支援、隔日生產、順位調整、外賓參觀', style: 'act-warning', icon: '⏸', noteLabel: '暫停原因（可留白）' },
  { type: '13', title: '生產異常停止稼動', hint: '設備故障、模具頓刀、品質異常', style: 'act-danger', icon: '⚠', noteLabel: '異常說明（可留白）' },
];

const STEP_FIELD = {
  '1':  { time: 'step1At',  note: null },
  '2':  { time: 'step2At',  note: null },
  '3':  { time: 'step3At',  note: null },
  '4':  { time: 'step4At',  note: null },
  '5':  { time: 'step5At',  note: null },
  '6':  { time: 'step6At',  note: null },
  '7':  { time: 'step7At',  note: null },
  '11': { time: 'step11At', note: null },
  '12': { time: 'step12At', note: 'step12Note' },
  '13': { time: 'step13At', note: 'step13Note' },
};

// ====== State ======
let token = localStorage.getItem('token') || '';
let me = JSON.parse(localStorage.getItem('me') || 'null');
let orderNo = '';
let order = null;
let scanner = null;
let scanMode = null;
let pendingStep = null;

// 狀態保存（防止重新整理或不小心登出丟失工作進度）
const STATE_KEY = 'scan_state';
function saveState() {
  if (!me || !me.id) return;
  const state = { leaderId: me.id, selectedMachine, orderNo };
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
}
function clearState() { localStorage.removeItem(STATE_KEY); }
function getSavedState() {
  try {
    const s = JSON.parse(localStorage.getItem(STATE_KEY) || 'null');
    if (!s || !me || s.leaderId !== me.id) return null;
    return s;
  } catch (e) { return null; }
}

// ====== Helpers ======
function $(id) { return document.getElementById(id); }

function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = '';
  if (type) t.classList.add(type);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

async function api(path, options = {}) {
  try {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_URL + path, {
      method: options.method || 'GET',
      headers,
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
    let data;
    try { data = await res.json(); }
    catch (e) { return { ok: false, status: res.status, error: '伺服器回應錯誤' }; }
    if (res.status === 401) {
      logout(true);
      return { ok: false, status: 401, error: data.error || '請重新登入' };
    }
    if (!res.ok) return { ok: false, status: res.status, error: data.error || '操作失敗', data };
    return { ok: true, data };
  } catch (err) {
    return { ok: false, error: '網路錯誤：' + (err && err.message ? err.message : err) };
  }
}

// ====== 登入 / 登出 ======
function showLogin(errMsg) {
  $('loginScreen').classList.add('show');
  $('loginError').textContent = errMsg || '';
  $('loginPassword').value = '';
  setTimeout(() => $('loginUsername').focus(), 100);
}
function hideLogin() {
  $('loginScreen').classList.remove('show');
}

async function doLogin() {
  const username = $('loginUsername').value.trim();
  const password = $('loginPassword').value;
  if (!username || !password) {
    $('loginError').textContent = '請輸入帳號密碼';
    return;
  }
  $('loginBtn').disabled = true;
  $('loginError').textContent = '';
  const r = await api('/api/auth/login', { method: 'POST', body: { username, password } });
  $('loginBtn').disabled = false;
  if (!r.ok) {
    $('loginError').textContent = r.error || '登入失敗';
    return;
  }
  token = r.data.token;
  me = r.data.leader;
  localStorage.setItem('token', token);
  localStorage.setItem('me', JSON.stringify(me));
  hideLogin();
  renderHeader();
  toast('登入成功', 'success');
  loadIdleMachines();
  restoreSavedState();
}

// 恢復上次未完成的工作狀態
async function restoreSavedState() {
  const s = getSavedState();
  if (!s) return;
  // 恢復機台選擇
  if (s.selectedMachine) {
    selectMachine(s.selectedMachine);
    // 恢復工單（如果有）
    if (s.orderNo) {
      setTimeout(() => {
        $('orderInput').value = s.orderNo;
        setOrder(s.orderNo);
      }, 100);
    }
    toast('已恢復上次進度', 'success');
  }
}

function logout(silent) {
  token = '';
  me = null;
  localStorage.removeItem('token');
  localStorage.removeItem('me');
  orderNo = '';
  order = null;
  selectedMachine = '';
  document.querySelectorAll('.machine-btn').forEach(b => b.classList.remove('selected'));
  $('machineEmpty').style.display = 'block';
  $('machineShow').style.display = 'none';
  $('orderCard').style.display = 'none';
  $('orderEmpty').style.display = 'block';
  $('orderShow').style.display = 'none';
  $('stepsArea').style.display = 'none';
  $('orderInput').value = '';
  $('bottomBar').classList.remove('show');
  renderHeader();
  showLogin(silent ? '登入逾期，請重新登入' : '');
}

$('loginBtn').onclick = doLogin;
$('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
$('loginUsername').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginPassword').focus(); });
$('logoutLink').onclick = e => { e.preventDefault(); if (confirm('確定登出？')) logout(); };

function renderHeader() {
  if (me) {
    $('leaderShow').textContent = me.displayName + (me.isAdmin ? '（管理員）' : '');
    $('menuBtn').style.display = 'flex';
    $('uploadLink').style.display = (me.isAdmin || me.isPlanner) ? 'flex' : 'none';
    $('adminLink').style.display = me.isAdmin ? 'flex' : 'none';
  } else {
    $('leaderShow').textContent = '未登入';
    $('menuBtn').style.display = 'none';
  }
}
document.addEventListener('click', e => {
  const menu = $('dropMenu');
  const btn = $('menuBtn');
  if (menu && !menu.contains(e.target) && btn && !btn.contains(e.target)) {
    menu.classList.remove('show');
  }
});

// ====== 機台（第一步）======
let selectedMachine = '';

function selectMachine(no) {
  selectedMachine = no;
  document.querySelectorAll('.machine-btn').forEach(b => {
    b.classList.toggle('selected', b.getAttribute('data-machine') === no);
  });
  $('orderCard').style.display = 'block';
  $('machineEmpty').style.display = 'none';
  $('machineShow').style.display = 'block';
  $('machineNoText').textContent = no;
  saveState();
  setTimeout(() => $('orderInput').focus(), 200);
}

let idleMachinesToday = new Set();

async function loadIdleMachines() {
  const r = await api('/api/idle-events?limit=50');
  if (!r.ok) return;
  const now = new Date();
  idleMachinesToday = new Set((r.data.events || []).filter(e => {
    const d = new Date(e.createdAt);
    return d.getFullYear() === now.getFullYear() &&
           d.getMonth() === now.getMonth() &&
           d.getDate() === now.getDate();
  }).map(e => e.machineNo));
  renderMachineButtons();
}

function renderMachineButtons() {
  document.querySelectorAll('.machine-btn').forEach(b => {
    const m = b.getAttribute('data-machine');
    const isIdle = idleMachinesToday.has(m);
    b.classList.toggle('disabled', isIdle);
    // 加/移除無工令標籤
    let tag = b.querySelector('.m-tag');
    if (isIdle && !tag) {
      const s = document.createElement('div');
      s.className = 'm-tag';
      s.textContent = '今日無工令';
      b.appendChild(s);
    } else if (!isIdle && tag) {
      tag.remove();
    }
  });
}

document.querySelectorAll('.machine-btn').forEach(b => {
  b.onclick = () => {
    const m = b.getAttribute('data-machine');
    if (idleMachinesToday.has(m)) {
      toast('此機台今日已記錄無工令，請到紀錄頁取消後再選擇', 'error');
      return;
    }
    selectMachine(m);
  };
});
$('changeMachineBtn').onclick = () => {
  clearState();
  selectedMachine = '';
  document.querySelectorAll('.machine-btn').forEach(b => b.classList.remove('selected'));
  $('machineEmpty').style.display = 'block';
  $('machineShow').style.display = 'none';
  $('orderCard').style.display = 'none';
  $('stepsArea').style.display = 'none';
  $('bottomBar').classList.remove('show');
};

// ====== 工單號（第二步）======
async function setOrder(no) {
  no = String(no || '').trim().toUpperCase();
  if (!no) { toast('工單號不可空白', 'error'); return; }
  if (!/^[A-Z]\d{10}$/.test(no)) { toast('工單號格式錯誤：需 1 個英文字母 + 10 個數字（例：F1150407024）', 'error'); return; }
  if (!selectedMachine) { toast('請先選擇機台', 'error'); return; }
  const r = await api('/api/orders/' + encodeURIComponent(no));
  if (!r.ok) { toast(r.error, 'error'); return; }
  orderNo = no;
  order = r.data.order;
  // 設定機台到 DB
  const mr = await api('/api/orders/' + encodeURIComponent(no) + '/machine', {
    method: 'POST',
    body: { machineNo: selectedMachine },
  });
  if (mr.ok) order = mr.data.order;
  $('orderEmpty').style.display = 'none';
  $('orderShow').style.display = 'block';
  $('orderNoText').textContent = no;
  $('orderUpdated').textContent = order.updatedAt ? ('最後更新：' + fmtTime(order.updatedAt)) : '尚未開始';
  saveState();
  renderSteps();
}

$('setOrderBtn').onclick = () => setOrder($('orderInput').value);
$('orderInput').addEventListener('keydown', e => { if (e.key === 'Enter') setOrder($('orderInput').value); });
$('scanOrderBtn').onclick = () => openScanner('order');
$('idleBtn').onclick = async () => {
  if (!selectedMachine) { toast('請先選擇機台', 'error'); return; }
  if (!confirm('確定記錄「生產無工令」？\n\n機台：' + selectedMachine + '\n（記錄後會跳回選機台）')) return;
  const note = prompt('備註（可留白）：', '') || '';
  const r = await api('/api/idle-events', { method: 'POST', body: { machineNo: selectedMachine, note } });
  if (!r.ok) { toast(r.error || '失敗', 'error'); return; }
  toast('已記錄無工令：' + selectedMachine, 'success');
  // 重置到選機台
  selectedMachine = '';
  document.querySelectorAll('.machine-btn').forEach(b => b.classList.remove('selected'));
  $('machineEmpty').style.display = 'block';
  $('machineShow').style.display = 'none';
  $('orderCard').style.display = 'none';
  $('orderInput').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  loadIdleMachines();
};
$('changeOrderBtn').onclick = () => {
  orderNo = ''; order = null;
  $('orderEmpty').style.display = 'block';
  $('orderShow').style.display = 'none';
  $('orderInput').value = '';
  $('stepsArea').style.display = 'none';
  $('bottomBar').classList.remove('show');
  saveState(); // 保留機台，但清空工單
};

// ====== 步驟渲染 ======
function renderSteps() {
  const area = $('stepsArea');
  area.style.display = 'block';
  area.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'card';

  const isPaused = (order.pause12 && order.pause12.active) || (order.pause13 && order.pause13.active);
  const doneCount = STEPS.filter(s => order[STEP_FIELD[s.id].time]).length;
  const pct = Math.round(doneCount / STEPS.length * 100);
  if (isPaused) {
    wrap.style.opacity = '0.5';
    wrap.style.pointerEvents = 'none';
  }
  const pauseNotice = isPaused ? '<div style="background:var(--brand);color:#fff;padding:10px 14px;border-radius:10px;text-align:center;font-weight:700;font-size:14px;margin-bottom:12px;">⏸ 暫停中 — 請先恢復生產才能繼續操作</div>' : '';
  wrap.innerHTML = `
    <h2>工序進度</h2>
    ${pauseNotice}
    <div class="progress-summary">
      <div class="text">
        已完成 ${doneCount} / ${STEPS.length} 項
        <small>掃描對應 QR 即可記錄時間</small>
      </div>
      <div class="count">${pct}%</div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
  `;

  STEPS.forEach(s => {
    const f = STEP_FIELD[s.id];
    const time = order[f.time];
    const done = !!time;
    const div = document.createElement('div');
    div.className = 'step' + (done ? ' done' : '');
    const numLabel = s.title.match(/^(\d+)\./)?.[1] || s.id;
    const titleText = s.title.replace(/^\d+\.\s*/, '');
    let body = `<div class="title">${escapeHtml(titleText)}` +
      (done ? '<span class="badge ok">已完成</span>' : '') +
      '</div>';
    if (s.hint) body += '<div class="hint">' + s.hint + '</div>';
    if (done) {
      body += '<div class="time">✓ ' + fmtTime(time) + '</div>';
      body += '<button class="btn-danger btn-block" data-clear="' + s.id + '"' + (isPaused ? ' disabled' : '') + '>取消此項</button>';
    } else if (isPaused) {
      body += '<div class="step-actions"><button class="btn-primary" disabled>📷 掃描完成</button><button class="btn-success" disabled>✓ 已完成</button></div>';
    } else {
      body += '<div class="step-actions"><button class="btn-primary" data-scan="' + s.id + '">📷 掃描完成</button><button class="btn-success" data-done="' + s.id + '">✓ 已完成</button></div>';
    }
    div.innerHTML = `<div class="step-num">${numLabel}</div><div class="step-body">${body}</div>`;
    wrap.appendChild(div);
  });

  area.appendChild(wrap);

  // 底部動作按鈕
  const actWrap = document.createElement('div');
  actWrap.className = 'card';
  actWrap.innerHTML = '<h2>操作</h2>';
  const actDiv = document.createElement('div');
  actDiv.className = 'action-buttons';

  // 暫停/異常按鈕（開關模式）
  PAUSE_TYPES.forEach(p => {
    const info = order['pause' + p.type]; // pause12 or pause13
    const isActive = info && info.active;
    const totalSec = info ? info.totalSec : 0;
    const count = info ? info.count : 0;
    const btn = document.createElement('button');
    if (isActive) {
      btn.className = 'action-btn ' + p.style;
      btn.style.animation = 'pulse 1.5s infinite';
      btn.innerHTML = `
        <div class="act-icon">▶</div>
        <div class="act-body">
          <div class="act-title">恢復生產</div>
          <div class="act-hint">${escapeHtml(p.title)} 中… <span class="live-timer" data-start="${info.active.startAt}"></span></div>
        </div>
      `;
      btn.onclick = () => resumePause(p.type);
    } else {
      btn.className = 'action-btn ' + p.style;
      let subtitle = p.hint;
      if (count > 0) subtitle = `累計 ${count} 次，共 ${fmtDuration(totalSec)}`;
      btn.innerHTML = `
        <div class="act-icon">${p.icon}</div>
        <div class="act-body">
          <div class="act-title">${escapeHtml(p.title)}</div>
          <div class="act-hint">${subtitle}</div>
        </div>
      `;
      btn.onclick = () => startPause(p);
    }
    actDiv.appendChild(btn);
  });

  // 完成按鈕
  const a = ACTIONS_FINISH;
  const finBtn = document.createElement('button');
  finBtn.className = 'action-btn ' + a.style;
  if (isPaused) {
    finBtn.disabled = true;
    finBtn.style.opacity = '0.5';
  }
  finBtn.innerHTML = `
    <div class="act-icon">${a.icon}</div>
    <div class="act-body">
      <div class="act-title">${escapeHtml(a.title)}</div>
      <div class="act-hint">${isPaused ? '暫停中，請先恢復' : escapeHtml(a.hint)}</div>
    </div>
  `;
  finBtn.onclick = async () => {
    if (isPaused) { toast('請先恢復生產', 'error'); return; }
    if (!confirm('確定完成此工單？\n\n（資料已自動儲存）')) return;
    try { await submitStep('11', ''); } catch(e) {}
    finishOrder();
  };
  actDiv.appendChild(finBtn);

  actWrap.appendChild(actDiv);
  area.appendChild(actWrap);

  startLiveTimers();

  area.querySelectorAll('[data-scan]').forEach(b => {
    b.onclick = () => startStepScan(b.getAttribute('data-scan'));
  });
  area.querySelectorAll('[data-done]').forEach(b => {
    b.onclick = () => submitStep(b.getAttribute('data-done'), '');
  });
  area.querySelectorAll('[data-clear]').forEach(b => {
    b.onclick = () => clearStep(b.getAttribute('data-clear'));
  });

  $('bottomBar').classList.remove('show');
}

function getCurrentStep() {
  let latest = null, latestTime = 0;
  STEPS.forEach(s => {
    const t = order[STEP_FIELD[s.id].time];
    if (t && new Date(t).getTime() > latestTime) {
      latestTime = new Date(t).getTime();
      latest = s;
    }
  });
  return latest ? latest.title : '尚未開始';
}

async function startPause(p) {
  if (!orderNo) return;
  let note = prompt(p.noteLabel + '：', '') || '';
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/pause', {
    method: 'POST',
    body: { type: p.type, note, activeStep: getCurrentStep() },
  });
  if (!r.ok) { toast(r.error, 'error'); return; }
  order = r.data.order;
  renderSteps();
  toast(p.title + ' — 開始計時', 'success');
  startLiveTimers();
}

async function resumePause(type) {
  if (!orderNo) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/resume', {
    method: 'POST',
    body: { type },
  });
  if (!r.ok) { toast(r.error, 'error'); return; }
  order = r.data.order;
  const dur = r.data.resumed ? r.data.resumed.duration : 0;
  renderSteps();
  toast('已恢復生產（暫停 ' + fmtDuration(dur) + '）', 'success');
}

function fmtDuration(sec) {
  if (!sec || sec < 0) return '0 秒';
  if (sec < 60) return sec + ' 秒';
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m < 60) return m + ' 分 ' + (s > 0 ? s + ' 秒' : '');
  const h = Math.floor(m / 60);
  return h + ' 時 ' + (m % 60) + ' 分';
}

// 即時計時器
let timerInterval = null;
function startLiveTimers() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateLiveTimers, 1000);
  updateLiveTimers();
}
function updateLiveTimers() {
  document.querySelectorAll('.live-timer').forEach(el => {
    const start = new Date(el.dataset.start);
    const sec = Math.round((Date.now() - start.getTime()) / 1000);
    el.textContent = fmtDuration(sec);
  });
  // 沒有 timer 就停止
  if (!document.querySelector('.live-timer')) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function finishOrder() {
  clearState();
  orderNo = ''; order = null; selectedMachine = '';
  document.querySelectorAll('.machine-btn').forEach(b => b.classList.remove('selected'));
  $('machineEmpty').style.display = 'block';
  $('machineShow').style.display = 'none';
  $('orderCard').style.display = 'none';
  $('orderEmpty').style.display = 'block';
  $('orderShow').style.display = 'none';
  $('orderInput').value = '';
  $('stepsArea').style.display = 'none';
  $('bottomBar').classList.remove('show');
  toast('已完成，請選擇機台開始下一張工單', 'success');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('finishBtn').onclick = finishOrder;

// ====== 步驟操作 ======
function startStepScan(stepId) {
  if (!orderNo) { toast('請先設定工單', 'error'); return; }
  pendingStep = stepId;
  openScanner('step');
}

async function clearStep(stepId) {
  if (!confirm('確定要取消「' + STEPS.find(s => s.id === stepId).title + '」的紀錄嗎？')) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/steps/' + stepId, { method: 'DELETE' });
  if (!r.ok) { toast(r.error, 'error'); return; }
  order = r.data.order;
  $('orderUpdated').textContent = '最後更新：' + fmtTime(order.updatedAt);
  renderSteps();
  toast('已取消紀錄', 'success');
}

async function submitStep(stepId, note) {
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/steps/' + stepId, {
    method: 'POST',
    body: { note: note || '' },
  });
  if (!r.ok) {
    toast(r.error, 'error');
    if (r.data && r.data.order) { order = r.data.order; renderSteps(); }
    return;
  }
  order = r.data.order;
  $('orderUpdated').textContent = '最後更新：' + fmtTime(order.updatedAt);
  renderSteps();
  toast('✓ 已記錄 ' + STEPS.find(s => s.id === stepId).title, 'success');
}

// ====== 掃描器 ======
function showCameraError(msg) {
  $('qr-reader').style.display = 'none';
  $('cameraError').style.display = 'block';
  $('cameraErrorMsg').textContent = msg;
}

function openScanner(mode) {
  scanMode = mode;
  const titles = {
    'order': '請對準工單條碼',
    'machine': '請對準機台 QR Code',
    'step': '請掃描工項 QR Code',
  };
  $('scannerTitle').textContent = titles[mode] || '請掃描 QR Code';
  $('scannerModal').classList.add('show');
  $('qr-reader').style.display = 'block';
  $('cameraError').style.display = 'none';

  // 檢查瀏覽器是否支援
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCameraError('此瀏覽器不支援相機（需 HTTPS + 現代瀏覽器）');
    return;
  }
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
    showCameraError('需在 HTTPS 網站才能使用相機');
    return;
  }

  if (!scanner) {
    try { scanner = new Html5Qrcode('qr-reader'); }
    catch (e) { showCameraError('掃描器初始化失敗：' + e.message); return; }
  }
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 260, height: 260 } },
    onScanSuccess,
    () => {},
  ).catch(err => {
    const errStr = String(err && err.message || err);
    let friendly = errStr;
    if (/Permission|NotAllowed|denied/i.test(errStr)) {
      friendly = '相機權限被拒絕。請到瀏覽器設定中開啟相機權限後重新整理。';
    } else if (/NotFound|no.*camera/i.test(errStr)) {
      friendly = '找不到相機裝置。';
    } else if (/NotReadable|in use|busy/i.test(errStr)) {
      friendly = '相機被其他 App 佔用，請關閉其他相機 App 後再試。';
    } else if (/Overconstrained/i.test(errStr)) {
      // 改用前鏡頭再試
      scanner.start({ facingMode: 'user' }, { fps: 10, qrbox: { width: 260, height: 260 } }, onScanSuccess, () => {})
        .catch(e2 => showCameraError('相機規格不支援：' + errStr));
      return;
    }
    showCameraError(friendly);
  });
}

async function closeScanner() {
  $('scannerModal').classList.remove('show');
  if (scanner) {
    try { await scanner.stop(); } catch (e) {}
  }
  // 關閉時讓對應的輸入框獲得焦點，方便手動輸入
  setTimeout(() => {
    if (scanMode === 'order') $('orderInput').focus();
    else if (scanMode === 'machine') $('machineInput').focus();
  }, 200);
}
$('closeScannerBtn').onclick = closeScanner;

async function onScanSuccess(decodedText) {
  if (scanMode === 'order') {
    await closeScanner();
    let raw = String(decodedText || '').trim();
    let extracted = raw;
    try {
      if (/^https?:\/\//i.test(raw)) {
        const u = new URL(raw);
        const q = u.searchParams;
        extracted = q.get('order') || q.get('orderNo') || q.get('no') || q.get('id') ||
                    u.pathname.split('/').filter(Boolean).pop() || raw;
      }
    } catch (e) {}
    $('orderInput').value = extracted;
    toast('掃到：' + raw.slice(0, 40) + (raw.length > 40 ? '…' : '') + '，請確認後按確定', 'success');
    $('orderInput').focus();
    return;
  }

  if (scanMode === 'machine') {
    await closeScanner();
    let raw = String(decodedText || '').trim();
    let extracted = raw;
    try {
      if (/^https?:\/\//i.test(raw)) {
        const u = new URL(raw);
        extracted = u.searchParams.get('machine') || u.pathname.split('/').filter(Boolean).pop() || raw;
      }
    } catch (e) {}
    $('machineInput').value = extracted;
    toast('掃到：' + raw.slice(0, 40) + (raw.length > 40 ? '…' : '') + '，請確認後按確定', 'success');
    $('machineInput').focus();
    return;
  }

  // step 模式
  const m = String(decodedText).match(/^STEP[:\-]?(\d+)$/i);
  if (!m) { toast('不是工項 QR：' + decodedText, 'error'); return; }
  const scanned = m[1];
  if (scanned !== pendingStep) {
    toast('掃到的是項目 ' + scanned + '，但你選的是項目 ' + pendingStep, 'error');
    return;
  }
  await closeScanner();

  await submitStep(pendingStep, '');
  pendingStep = null;
}

// ====== 啟動 ======
renderHeader();
if (API_URL.startsWith('PASTE_')) {
  toast('尚未設定 API_URL，請先部署後端', 'error');
} else if (!token) {
  showLogin();
} else {
  loadIdleMachines();
  restoreSavedState();
}
</script>
