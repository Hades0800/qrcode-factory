<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>上鎧鋼鐵 - 工項 QR Code 列印</title>
<link rel="icon" href="logo.jpg">
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    margin: 0;
    padding: 10mm;
    background: #fff;
    color: #000;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8mm;
    margin-bottom: 4mm;
    padding-bottom: 3mm;
    border-bottom: 2px solid #d23535;
  }
  .header-row img { height: 14mm; width: auto; }
  .header-row h1 { font-size: 14pt; margin: 0; color: #1c1c1e; font-weight: 800; }
  .header-row .sub { font-size: 9pt; color: #666; margin-top: 1mm; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 4mm;
    width: 100%;
  }
  .qr-card {
    border: 2px solid #1c1c1e;
    border-radius: 4mm;
    padding: 3mm;
    text-align: center;
    page-break-inside: avoid;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 58mm;
  }
  .qr-card .num {
    font-size: 24pt;
    font-weight: 900;
    line-height: 1;
    color: #d23535;
  }
  .qr-card .title { font-size: 12pt; font-weight: 700; margin: 1mm 0; color: #1c1c1e; }
  .qr-card img { display: block; width: 38mm; height: 38mm; margin: 1mm 0; }
  .qr-card .hint { font-size: 8pt; color: #555; min-height: 4mm; }
  .qr-card .code { font-size: 7pt; color: #888; }
  @media print {
    body { padding: 0; }
    .tip { display: none; }
  }
  .tip {
    font-size: 10pt;
    color: #666;
    text-align: center;
    margin-bottom: 4mm;
  }
</style>
</head>
<body>
<div class="header-row">
  <img src="logo.jpg" alt="上鎧鋼鐵">
  <div>
    <h1>廠務工項 QR Code</h1>
    <div class="sub">SHANG KAI STEEL · 廠務工單系統</div>
  </div>
</div>
<p class="tip">Cmd/Ctrl+P 列印 A4。剪下後護貝貼於現場機台。</p>

<div class="grid">

  <div class="qr-card">
    <div class="num">1</div>
    <div class="title">原料準備與設置</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=STEP%3A1" alt="STEP:1">
    <div class="hint">&nbsp;</div>
    <div class="code">STEP:1</div>
  </div>

  <div class="qr-card">
    <div class="num">2</div>
    <div class="title">模刀具準備與安裝</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=STEP%3A2" alt="STEP:2">
    <div class="hint">&nbsp;</div>
    <div class="code">STEP:2</div>
  </div>

  <div class="qr-card">
    <div class="num">3</div>
    <div class="title">試模與規格品質確認</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=STEP%3A3" alt="STEP:3">
    <div class="hint">&nbsp;</div>
    <div class="code">STEP:3</div>
  </div>

  <div class="qr-card">
    <div class="num">4</div>
    <div class="title">穩定連續生產-無中斷</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=STEP%3A4" alt="STEP:4">
    <div class="hint">連續生產期間沒有任何中斷</div>
    <div class="code">STEP:4</div>
  </div>

  <div class="qr-card">
    <div class="num">5</div>
    <div class="title">穩定連續生產-中斷調整</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=STEP%3A5" alt="STEP:5">
    <div class="hint">生產過程中有少量調整中斷</div>
    <div class="code">STEP:5</div>
  </div>

  <div class="qr-card">
    <div class="num">6</div>
    <div class="title">穩定連續生產-中斷多次</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=STEP%3A8" alt="STEP:8">
    <div class="hint">生產過程中多次中斷</div>
    <div class="code">STEP:8</div>
  </div>

  <div class="qr-card">
    <div class="num">7</div>
    <div class="title">後工程接續生產</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=STEP%3A6" alt="STEP:6">
    <div class="hint">軋平／捲網／波浪網等</div>
    <div class="code">STEP:6</div>
  </div>

  <div class="qr-card">
    <div class="num">8</div>
    <div class="title">生產異常或註記事項</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=STEP%3A7" alt="STEP:7">
    <div class="hint">設備故障／品質異常等</div>
    <div class="code">STEP:7</div>
  </div>

</div>
</body>
</html>
