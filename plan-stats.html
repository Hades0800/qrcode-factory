<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>上鎧鋼鐵 - 生產進度統計</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="styles.css">
<style>
  :root {
    --brand: #d23535;
    --brand-dark: #a82828;
    --brand-soft: #fdf2f2;
    --ink: #1c1c1e;
    --text: #2c2c2e;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --bg: #f2f2f5;
    --card: #ffffff;
    --success: #2ea043;
    --warn: #f5c518;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    zoom: 1.15;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
    position: relative;
    z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  header .brand img { height: 30px; width: auto; flex-shrink: 0; }
  header .brand-text { border-left: 2px solid var(--border); padding-left: 10px; line-height: 1.2; min-width: 0; flex: 1; }
  header .brand-text .title { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .brand-text .sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu-toggle {
    background: none; border: none; font-size: 22px; color: var(--ink);
    cursor: pointer; padding: 6px 10px; border-radius: 8px; min-height: 36px;
    display: flex; align-items: center; flex-shrink: 0;
  }
  .dropdown-menu {
    display: none; position: fixed; top: 56px; right: 8px;
    background: #fff; border-radius: 12px; min-width: 170px; z-index: 999; padding: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);
  }
  .dropdown-menu.show { display: block; }
  .dropdown-menu a {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    font-size: 15px; font-weight: 600; color: var(--text);
    text-decoration: none; border-radius: 8px;
  }
  .dropdown-menu a:hover { background: var(--bg); }
  .dropdown-menu a.nav-active { color: var(--brand); background: var(--brand-soft); }
  .dropdown-menu .menu-sep { height: 1px; background: var(--border); margin: 4px 8px; }
  .dropdown-menu a.menu-logout { color: var(--muted); }

  .container { padding: 16px; max-width: 100%; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.02);
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
  .toolbar .field { display: flex; flex-direction: column; }
  .toolbar label {
    font-size: 11px; color: var(--muted); margin-bottom: 4px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
  }
  .toolbar input, .toolbar select {
    padding: 8px 10px; font-size: 14px;
    border: 1.5px solid var(--border); border-radius: 8px; background: #fff; color: var(--ink);
  }
  button {
    appearance: none; border: none; border-radius: 8px;
    font-size: 14px; padding: 9px 14px; cursor: pointer; font-weight: 600;
    font-family: inherit; transition: transform .08s, background .15s;
  }
  button:active { transform: scale(.98); }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 2px 6px rgba(210,53,53,.2); }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-secondary { background: #f2f2f5; color: var(--ink); border: 1.5px solid var(--border); }
  .btn-secondary:hover { background: #e8e8eb; }

  /* 統計卡片 */
  .ps-title {
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 14px;
  }
  .ps-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 24px;
    margin-bottom: 8px;
  }
  .ps-line { font-size: 14px; color: var(--ink); }
  .ps-line .lbl { color: var(--muted); margin-right: 6px; }
  .ps-line .val { font-weight: 700; color: var(--ink); }
  .ps-line .val.brand { color: var(--brand); }
  .ps-line .val.success { color: var(--success); }

  .ps-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 6px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    font-size: 13px;
  }
  .ps-legend .lg { display: inline-flex; align-items: center; gap: 6px; }
  .ps-dot {
    display: inline-block;
    width: 14px; height: 14px; border-radius: 50%;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06);
  }
  .ps-dot.red    { background: #d23535; }
  .ps-dot.yellow { background: #f5c518; }
  .ps-dot.green  { background: #2ea043; }

  /* 計畫達成度表 */
  .ps-grid-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  table.ps-grid {
    border-collapse: collapse;
    font-size: 13px;
    min-width: 100%;
  }
  table.ps-grid th, table.ps-grid td {
    border-bottom: 1px solid var(--border);
    text-align: center;
    padding: 8px 6px;
    white-space: nowrap;
  }
  table.ps-grid th {
    background: #fafafc;
    color: var(--muted);
    font-weight: 700;
    font-size: 12px;
    position: sticky; top: 0;
    border-bottom: 2px solid var(--border);
  }
  table.ps-grid th.ps-order-col,
  table.ps-grid td.ps-order-col {
    text-align: left;
    padding-left: 12px;
    padding-right: 14px;
    font-weight: 700;
    color: var(--ink);
    position: sticky; left: 0;
    background: #fff;
    box-shadow: 1px 0 0 var(--border);
    min-width: 130px;
  }
  table.ps-grid th.ps-order-col { background: #fafafc; }
  table.ps-grid tr:hover td { background: #fafafc; }
  table.ps-grid tr:hover td.ps-order-col { background: #fafafc; }

  table.ps-grid td.ps-cell { min-width: 30px; padding: 6px 5px; }
  .ps-cell .ps-dot { width: 12px; height: 12px; }
  .ps-cell .ps-cellwrap { display: inline-flex; align-items: center; justify-content: center; gap: 3px; }
  .ps-cell .ps-qty { font-size: 11px; font-weight: 700; color: #333; }
  .ps-cell.today { background: #fff8e8; }
  table.ps-grid th.today { background: #fff3c4; color: var(--brand); }

  /* 工號可點：點一下顯示生產規格 */
  td.ps-order-col.ps-order-click { cursor: pointer; }
  td.ps-order-col.ps-order-click:hover { color: var(--brand); text-decoration: underline; }
  #psSpecPop {
    position: fixed; z-index: 1000; display: none; max-width: 280px;
    background: #1c1c1e; color: #fff; padding: 10px 12px; border-radius: 10px;
    font-size: 13px; line-height: 1.5; box-shadow: 0 6px 24px rgba(0,0,0,.28);
  }
  #psSpecPop .pop-order { font-size: 11px; color: #bbb; margin-bottom: 3px; }
  #psSpecPop .pop-spec { font-weight: 700; font-size: 15px; word-break: break-word; }
  #psSpecPop .pop-customer { font-size: 13px; color: #ffd47f; margin-top: 4px; word-break: break-word; }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 14px;
  }

  #toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(28,28,30,.95); color: #fff;
    padding: 14px 22px; border-radius: 12px;
    font-size: 14px; font-weight: 600; display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  #toast.show { display: block; }
  #toast.error { background: var(--brand); }
  #toast.success { background: var(--success); }

  /* ===== 手機版 ===== */
  @media (max-width: 600px) {
    .container { padding: 12px; }
    /* 篩選列：月份 / 機台各半行，重新整理整行、好按 */
    .toolbar { gap: 8px; }
    .toolbar .field { flex: 1 1 calc(50% - 4px); min-width: 0; }
    .toolbar input, .toolbar select { width: 100%; min-height: 40px; }
    .toolbar #refreshBtn { flex: 1 1 100%; min-height: 42px; }
    /* 格狀圖：工號欄縮窄，露出更多日期格 */
    table.ps-grid th.ps-order-col,
    table.ps-grid td.ps-order-col { min-width: 90px; padding-left: 8px; padding-right: 8px; font-size: 12px; }
    table.ps-grid th, table.ps-grid td { padding: 8px 4px; }
    table.ps-grid td.ps-cell { min-width: 30px; }
    .ps-cell .ps-qty { font-size: 11px; }
    .ps-cell .ps-dot { width: 12px; height: 12px; }
    /* 點工號彈出的生產規格框：不超出螢幕 */
    #psSpecPop { max-width: 90vw; }
    #psSpecPop .pop-spec { font-size: 16px; }
  }
</style>

<script>
const me = getMe();
if (!me) location.href = 'index.html';

$('meShow').textContent = me ? (me.displayName + (me.isAdmin ? '（管理員）' : '')) : '';
if (me && me.isAdmin) $('adminLink').style.display = 'flex';
if (me && (me.isAdmin || me.isPlanner)) $('uploadLink').style.display = 'flex';
initDropdownMenu();
$('logoutLink').onclick = e => {
  e.preventDefault();
  if (!confirm('登出？')) return;
  localStorage.clear();
  location.href = 'index.html';
};

const MACHINES = [
  { id: 'No1-350', num: 'No1', spec: '350' },
  { id: 'No2-250', num: 'No2', spec: '250' },
  { id: 'No3-60',  num: 'No3', spec: '60' },
  { id: 'No4-90',  num: 'No4', spec: '90' },
  { id: 'No5-40',  num: 'No5', spec: '40' },
  { id: 'No6-40',  num: 'No6', spec: '40' },
];

// 機台下拉
const machineSel = $('filterMachine');
MACHINES.forEach(m => {
  const opt = document.createElement('option');
  opt.value = m.id;
  opt.textContent = m.id;
  machineSel.appendChild(opt);
});

// 預設：本月 + 第一台機
(function setDefaults() {
  const now = new Date();
  const ym = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  $('filterMonth').value = ym;
  machineSel.value = MACHINES[0].id;
})();

let allOrders = [];

async function loadOrders() {
  $('gridArea').innerHTML = '<div class="empty">載入中...</div>';
  const r = await api('/api/orders?limit=500');
  if (!r.ok) {
    $('gridArea').innerHTML = '<div class="empty">' + (r.error || '載入失敗') + '</div>';
    return;
  }
  allOrders = r.data.orders || [];
  render();
}

// 取台灣本地日期 yyyy-mm-dd（從 ISO 字串或 Date）
function ymd(d) {
  if (!d) return null;
  const dt = (d instanceof Date) ? d : new Date(d);
  if (isNaN(dt)) return null;
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}

// 工單的計畫日期（優先 plannedDate，fallback productionDate）
function getPlannedYmd(o) {
  return ymd(o.plannedDate) || ymd(o.productionDate);
}
// 工單的完成日期
function getCompletionYmd(o) {
  return ymd(o.step11At);
}
// 工單的實際開始日期（用 actualStartDate；若無，掃所有活動取最早）
function getActualStartYmd(o) {
  if (o.actualStartDate) return ymd(o.actualStartDate);
  let min = null;
  const consider = t => {
    if (!t) return;
    const v = new Date(t).getTime();
    if (isNaN(v)) return;
    if (min === null || v < min) min = v;
  };
  ['step1At','step2At','step3At','step4At','step5At','step6At','step7At','step11At','step21At','step22At','step23At']
    .forEach(k => consider(o[k]));
  (o.stepEntries || []).forEach(e => consider(e.recordedAt));
  ((o.pause12 && o.pause12.history) || []).forEach(e => { consider(e.startAt); consider(e.endAt); });
  ((o.pause13 && o.pause13.history) || []).forEach(e => { consider(e.startAt); consider(e.endAt); });
  return min === null ? null : ymd(new Date(min));
}

// 該工單是否屬於指定機台（machineNo 為現場記錄；plannedMachineNo 為原計畫）
function orderMatchesMachine(o, machine) {
  return o.machineNo === machine || o.plannedMachineNo === machine;
}

// 一張工單的「實際生產數量」（QC 回報）
//   已完成(step11)：Σ 各段更換規格 QC + 完成 QC
//   未完成但有下班回報（隔日生產）：Σ 各段更換規格 QC + 最後一次下班 QC
//   兩者都沒有：只算已結束規格段（step30）的量
function actualQtyOf(o) {
  const step30Sum = (o.stepEntries || [])
    .filter(e => e.stepNo === '30' && e.qcActualQty != null)
    .reduce((s, e) => s + (Number(e.qcActualQty) || 0), 0);
  if (o.step11At && o.step11QcActualQty != null) {
    return step30Sum + (Number(o.step11QcActualQty) || 0);
  }
  const offWork = ((o.pause12 && o.pause12.history) || []).filter(e => e.qcActualQty != null);
  if (offWork.length > 0) {
    return step30Sum + (Number(offWork[offWork.length - 1].qcActualQty) || 0);
  }
  return step30Sum;
}
// 計畫數量 = 派工數
function plannedQtyOf(o) {
  return Number(o.dispatchQty) || 0;
}

// 每日實際生產數量（QC 回報）→ { 'yyyy-mm-dd': 數量 }
//   依各 QC 回報的時間點歸於當天：更換規格(30)、下班回報(pause12)、完成(11)
function qtyByDayOf(o) {
  const map = {};
  const add = (t, q) => {
    const k = ymd(t);
    const n = Number(q);
    if (!k || !Number.isFinite(n) || n === 0) return;
    map[k] = (map[k] || 0) + n;
  };
  (o.stepEntries || []).forEach(e => {
    if (e.stepNo === '30' && e.qcActualQty != null) add(e.recordedAt, e.qcActualQty);
  });
  if (o.step11At && o.step11QcActualQty != null) add(o.step11At, o.step11QcActualQty);
  ((o.pause12 && o.pause12.history) || []).forEach(e => {
    if (e.qcActualQty != null) add(e.startAt || e.endAt, e.qcActualQty);
  });
  return map;
}

// 多規格工單拆段：每筆「更換規格(30)」收掉一段，最後一段由「完成(11)」收掉
//   回傳 [{ymd, qty, closed}]；單規格（無更換規格紀錄）回傳 null
function specSegmentsOf(o) {
  const step30s = (o.stepEntries || [])
    .filter(e => e.stepNo === '30')
    .sort((a, b) => new Date(a.recordedAt) - new Date(b.recordedAt));
  if (step30s.length === 0) return null;
  const segs = step30s.map(e => ({
    ymd: ymd(e.recordedAt),
    qty: e.qcActualQty != null ? Number(e.qcActualQty) : null,
    closed: true,
  }));
  // 最後一段：已完成用 step11；進行中用最近一次下班回報（沒有就掛在今天）
  if (o.step11At) {
    segs.push({ ymd: ymd(o.step11At), qty: o.step11QcActualQty != null ? Number(o.step11QcActualQty) : null, closed: true });
  } else {
    const off = ((o.pause12 && o.pause12.history) || []).filter(e => e.qcActualQty != null);
    const last = off[off.length - 1];
    segs.push({ ymd: last ? ymd(last.startAt || last.endAt) : null, qty: last ? Number(last.qcActualQty) : null, closed: false });
  }
  return segs;
}

function render() {
  const monthStr = $('filterMonth').value; // yyyy-mm
  const machine = machineSel.value;
  if (!monthStr || !machine) return;

  const [yy, mm] = monthStr.split('-').map(n => parseInt(n, 10));
  const daysInMonth = new Date(yy, mm, 0).getDate(); // mm 是 1-12，Date(yy,mm,0) = 該月最後一天
  const todayYmd = ymd(new Date());
  const todayInThisMonth = todayYmd.startsWith(monthStr);

  // 篩選：計畫日期落在此月份 + 機台
  const rows = allOrders.filter(o => {
    if (!orderMatchesMachine(o, machine)) return false;
    const p = getPlannedYmd(o);
    if (!p) return false;
    return p.startsWith(monthStr);
  });

  // 件數統計（保留作為參考資訊）
  const monthPlanned = rows.length;
  const monthDone = rows.filter(o => !!o.step11At).length;

  // 當日（若今天屬於本月，用今天；否則用該月最後一天）
  const refYmd = todayInThisMonth ? todayYmd : (monthStr + '-' + String(daysInMonth).padStart(2,'0'));
  const refDay = parseInt(refYmd.split('-')[2], 10);

  // 當日完成件數 / 延誤件數（件數，參考用）
  const todayDone = rows.filter(o => getCompletionYmd(o) === refYmd).length;
  const todayDelayed = rows.filter(o => {
    const c = getCompletionYmd(o);
    const p = getPlannedYmd(o);
    return c === refYmd && p && p < refYmd;
  }).length;

  // === 數量基準達成率（以實際生產數量計算）===
  // 計畫數量：依「計畫日期」歸到該日（Σ 派工數）
  // 完成數量：依「完成日期」歸到該日（Σ 實際生產數量 QC）
  const machineOrders = allOrders.filter(o => orderMatchesMachine(o, machine));
  const plannedByDay = {};
  const completedByDay = {};
  machineOrders.forEach(o => {
    const p = getPlannedYmd(o);
    if (p && p.startsWith(monthStr)) plannedByDay[p] = (plannedByDay[p] || 0) + plannedQtyOf(o);
    const c = getCompletionYmd(o);
    if (c && c.startsWith(monthStr)) completedByDay[c] = (completedByDay[c] || 0) + actualQtyOf(o);
  });

  // 日達成率 = 當日完成數量 / 當日計畫數量
  const dayPlannedQty = plannedByDay[refYmd] || 0;
  const dayCompletedQty = completedByDay[refYmd] || 0;
  const dayRate = dayPlannedQty > 0 ? (dayCompletedQty / dayPlannedQty * 100).toFixed(1) : null;

  // 月達成率 = Σ(每日達成率) / 當月日曆天數（本月只算到今天）
  const lastDay = todayInThisMonth ? refDay : daysInMonth;
  let rateSum = 0;
  for (let d = 1; d <= lastDay; d++) {
    const key = monthStr + '-' + String(d).padStart(2, '0');
    const pq = plannedByDay[key] || 0;
    const cq = completedByDay[key] || 0;
    rateSum += pq > 0 ? (cq / pq) : 0;
  }
  const monthRate = lastDay > 0 ? (rateSum / lastDay * 100).toFixed(1) : null;

  // 標題
  $('psTitle').textContent = yy + '年' + mm + '月份生產進度統計';

  // 上方統計列
  $('psSummary').innerHTML = `
    <div class="ps-line"><span class="lbl">機台編號：</span><span class="val">${machine}</span></div>
  `;

  // 沒資料
  if (rows.length === 0) {
    $('gridArea').innerHTML = '<div class="empty">此機台本月份沒有計畫工單</div>';
    return;
  }

  // 依計畫日期 → 工單號 排序
  rows.sort((a, b) => {
    const pa = getPlannedYmd(a) || '';
    const pb = getPlannedYmd(b) || '';
    if (pa !== pb) return pa < pb ? -1 : 1;
    return (a.orderNo || '').localeCompare(b.orderNo || '');
  });

  // 表格
  let html = '<table class="ps-grid"><thead><tr>';
  html += '<th class="ps-order-col">工號</th>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dYmd = monthStr + '-' + String(d).padStart(2,'0');
    const isToday = dYmd === todayYmd;
    html += `<th class="${isToday ? 'today' : ''}">${mm}/${d}</th>`;
  }
  html += '</tr></thead><tbody>';

  for (const o of rows) {
    const plan = getPlannedYmd(o);
    const start = getActualStartYmd(o);
    const done = getCompletionYmd(o);
    const qtyMap = qtyByDayOf(o);

    // 多規格工單：每個規格段一列（工號-1、-2…）
    //   軌跡：上一段收掉那天（第一段=工單實際開始日）→ 本段收掉那天
    //   中途天=黃點（有下班回報附數量）；收掉那天=綠點+段數量；未收掉的最後一段畫黃到今天
    const segs = specSegmentsOf(o);
    if (segs && segs.length > 1) {
      // 下班回報的每日數量（標在中途天的黃點旁）
      const offQtyByDay = {};
      ((o.pause12 && o.pause12.history) || []).forEach(e => {
        if (e.qcActualQty != null) {
          const k = ymd(e.startAt || e.endAt);
          if (k) offQtyByDay[k] = (offQtyByDay[k] || 0) + Number(e.qcActualQty);
        }
      });
      const orderStart = getActualStartYmd(o);
      segs.forEach((seg, i) => {
        const segStart = i === 0 ? (orderStart || seg.ymd) : segs[i - 1].ymd;
        const segEnd = seg.closed ? seg.ymd : todayYmd;
        html += `<tr><td class="ps-order-col ps-order-click" data-orderno="${escapeHtml(o.orderNo)}" title="點一下看生產規格">${escapeHtml(o.orderNo)}-${i + 1}</td>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dYmd = monthStr + '-' + String(d).padStart(2,'0');
          const isToday = dYmd === todayYmd;
          let inner = '';
          if (segStart && segEnd && dYmd >= segStart && dYmd <= segEnd) {
            if (seg.closed && dYmd === seg.ymd) {
              const qtyHtml = (seg.qty != null) ? `<span class="ps-qty">${seg.qty}</span>` : '';
              inner = `<span class="ps-cellwrap"><span class="ps-dot green" title="已完成"></span>${qtyHtml}</span>`;
            } else {
              const q = offQtyByDay[dYmd];
              const qtyHtml = (q != null) ? `<span class="ps-qty">${q}</span>` : '';
              inner = `<span class="ps-cellwrap"><span class="ps-dot yellow" title="生產中"></span>${qtyHtml}</span>`;
            }
          }
          html += `<td class="ps-cell ${isToday ? 'today' : ''}">${inner}</td>`;
        }
        html += '</tr>';
      });
      continue;
    }

    html += `<tr><td class="ps-order-col ps-order-click" data-orderno="${escapeHtml(o.orderNo)}" title="點一下看生產規格">${escapeHtml(o.orderNo)}</td>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dYmd = monthStr + '-' + String(d).padStart(2,'0');
      const isToday = dYmd === todayYmd;

      // 顯示範圍：plan 到 (done 或 今天)
      const upperBound = done || todayYmd;
      let dot = '';
      if (plan && dYmd >= plan && dYmd <= upperBound) {
        if (done && dYmd === done) {
          dot = '<span class="ps-dot green" title="已完成"></span>';
        } else if (start && dYmd >= start) {
          dot = '<span class="ps-dot yellow" title="進行中"></span>';
        } else {
          dot = '<span class="ps-dot red" title="未完成"></span>';
        }
      }
      const dayQty = qtyMap[dYmd];
      // 有產量的那天一定要有點：完成日綠、其他黃（涵蓋現場比計畫日早生產的情況）
      if (!dot && dayQty != null) {
        dot = (done && dYmd === done)
          ? '<span class="ps-dot green" title="已完成"></span>'
          : '<span class="ps-dot yellow" title="生產中"></span>';
      }
      const qtyHtml = (dayQty != null) ? `<span class="ps-qty">${dayQty}</span>` : '';
      const cellInner = (dot || qtyHtml) ? `<span class="ps-cellwrap">${dot}${qtyHtml}</span>` : '';
      html += `<td class="ps-cell ${isToday ? 'today' : ''}">${cellInner}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  $('gridArea').innerHTML = html;
}

['filterMonth','filterMachine'].forEach(id => {
  $(id).addEventListener('change', render);
});
$('refreshBtn').onclick = loadOrders;

// 點工號 → 顯示該工單生產規格（手機點一下也行）
const specPop = document.createElement('div');
specPop.id = 'psSpecPop';
specPop.innerHTML = '<div class="pop-order"></div><div class="pop-spec"></div><div class="pop-customer"></div>';
document.body.appendChild(specPop);

document.addEventListener('click', (e) => {
  const cell = e.target.closest('.ps-order-click');
  if (cell) {
    const orderNo = cell.dataset.orderno;
    const o = allOrders.find(x => x.orderNo === orderNo);
    const spec = (o && o.productSpec) ? o.productSpec : '（未填生產規格）';
    const customer = (o && o.customerName) ? o.customerName : '（未填客戶名稱）';
    specPop.querySelector('.pop-order').textContent = '工單 ' + orderNo;
    specPop.querySelector('.pop-spec').textContent = spec;
    specPop.querySelector('.pop-customer').textContent = '客戶：' + customer;
    specPop.style.display = 'block';
    // 定位需把 body 的 zoom 算進去，否則下半部工單的彈窗會超出螢幕被切掉
    const Z = parseFloat(getComputedStyle(document.body).zoom) || 1;
    const rect = cell.getBoundingClientRect();          // 視覺座標（已含 zoom）
    const pw = specPop.offsetWidth * Z;                 // 彈窗視覺寬高
    const ph = specPop.offsetHeight * Z;
    const vw = window.innerWidth, vh = window.innerHeight;
    let left = rect.left;
    if (left + pw > vw - 8) left = vw - pw - 8;
    if (left < 8) left = 8;
    // 預設顯示在該列下方；放不下就翻到上方；再不行就貼齊螢幕底
    let top = rect.bottom + 6;
    if (top + ph > vh - 8) top = rect.top - ph - 6;
    if (top < 8) top = Math.max(8, vh - ph - 8);
    specPop.style.left = (left / Z) + 'px';             // fixed 座標也會被 zoom 放大，要除回去
    specPop.style.top = (top / Z) + 'px';
    e.stopPropagation();
    return;
  }
  specPop.style.display = 'none';   // 點其他地方關閉
});

loadOrders();
</script>
</body>
</html>
