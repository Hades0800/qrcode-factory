<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>廠務工單系統 - 管理</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Microsoft JhengHei", sans-serif;
    background: #f4f6f8;
    color: #222;
  }
  header {
    background: #1f3a5f;
    color: #fff;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 17px; }
  header a { color: #fff; font-size: 13px; text-decoration: none; opacity: .9; }
  .container { padding: 14px; max-width: 720px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; color: #1f3a5f; }
  label { display: block; font-size: 13px; color: #555; margin: 8px 0 4px; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    border: 1px solid #cfd4da;
    border-radius: 6px;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: #1f6feb; color: #fff; }
  .btn-secondary { background: #6c757d; color: #fff; }
  .btn-danger { background: #d73a49; color: #fff; }
  .btn-block { width: 100%; padding: 12px; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin: 10px 0; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; font-size: 13px; }
  .badge {
    display: inline-block;
    background: #2ea043;
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .row-actions button { padding: 5px 10px; font-size: 12px; margin-right: 4px; }
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.85);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    display: none;
    max-width: 90%;
    text-align: center;
  }
  #toast.show { display: block; }
  #toast.error { background: #d73a49; }
  #toast.success { background: #2ea043; }
</style>
</head>
<body>

<header>
  <div>
    <h1>管理 - 小組長帳號</h1>
    <div style="font-size:12px;opacity:.85;" id="meShow"></div>
  </div>
  <div>
    <a href="index.html">← 回掃描頁</a>
    &nbsp; <a href="#" id="logoutLink">登出</a>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>新增小組長</h2>
    <label>帳號（英數，登入用）</label>
    <input type="text" id="newUsername" autocapitalize="none" placeholder="例：wang">
    <label>顯示名稱（記錄到工單上的人名）</label>
    <input type="text" id="newDisplayName" placeholder="例：王大明">
    <label>密碼（至少 6 字）</label>
    <input type="password" id="newPassword">
    <div class="checkbox-row">
      <input type="checkbox" id="newIsAdmin">
      <label for="newIsAdmin" style="margin:0;">設為管理員</label>
    </div>
    <button class="btn-primary btn-block" id="createBtn">新增帳號</button>
  </div>

  <div class="card">
    <h2>所有小組長</h2>
    <div id="leadersTable">載入中...</div>
  </div>

</div>

<div id="toast"></div>

<script>
const API_URL = 'PASTE_YOUR_ZEABUR_BACKEND_URL_HERE';

let token = localStorage.getItem('token') || '';
let me = JSON.parse(localStorage.getItem('me') || 'null');

function $(id) { return document.getElementById(id); }
function toast(msg, type) {
  const t = $('toast');
  t.textContent = msg;
  t.className = '';
  if (type) t.classList.add(type);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

async function api(path, options = {}) {
  try {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch(API_URL + path, {
      method: options.method || 'GET',
      headers,
      body: options.body ? JSON.stringify(options.body) : undefined,
    });
    let data;
    try { data = await res.json(); }
    catch (e) { return { ok: false, status: res.status, error: '伺服器回應錯誤' }; }
    if (res.status === 401 || res.status === 403) {
      alert(data.error || '需要管理員權限');
      location.href = 'index.html';
      return { ok: false };
    }
    if (!res.ok) return { ok: false, error: data.error || '操作失敗', data };
    return { ok: true, data };
  } catch (err) {
    return { ok: false, error: '網路錯誤：' + (err && err.message ? err.message : err) };
  }
}

// 權限檢查
if (!token || !me) {
  alert('請先登入');
  location.href = 'index.html';
}
if (me && !me.isAdmin) {
  alert('需要管理員權限');
  location.href = 'index.html';
}
if (me) $('meShow').textContent = '管理員：' + me.displayName;

$('logoutLink').onclick = e => {
  e.preventDefault();
  if (!confirm('登出？')) return;
  localStorage.removeItem('token');
  localStorage.removeItem('me');
  location.href = 'index.html';
};

async function loadLeaders() {
  const r = await api('/api/admin/leaders');
  if (!r.ok) { $('leadersTable').textContent = r.error || '載入失敗'; return; }
  const leaders = r.data.leaders;
  if (!leaders.length) { $('leadersTable').innerHTML = '<div style="color:#999;">尚無帳號</div>'; return; }
  const rows = leaders.map(l => `
    <tr>
      <td><strong>${escapeHtml(l.displayName)}</strong>${l.isAdmin ? ' <span class="badge">管理員</span>' : ''}<br><span style="color:#888;font-size:12px;">@${escapeHtml(l.username)}</span></td>
      <td style="font-size:12px;color:#666;">${fmtDate(l.createdAt)}</td>
      <td class="row-actions">
        <button class="btn-secondary" data-reset="${l.id}" data-name="${escapeHtml(l.displayName)}">改密碼</button>
        ${l.id === me.id ? '' : `<button class="btn-danger" data-delete="${l.id}" data-name="${escapeHtml(l.displayName)}">刪除</button>`}
      </td>
    </tr>
  `).join('');
  $('leadersTable').innerHTML = `<table><thead><tr><th>姓名 / 帳號</th><th>建立日期</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;

  $('leadersTable').querySelectorAll('[data-reset]').forEach(b => {
    b.onclick = () => resetPassword(b.dataset.reset, b.dataset.name);
  });
  $('leadersTable').querySelectorAll('[data-delete]').forEach(b => {
    b.onclick = () => deleteLeader(b.dataset.delete, b.dataset.name);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('createBtn').onclick = async () => {
  const username = $('newUsername').value.trim();
  const displayName = $('newDisplayName').value.trim();
  const password = $('newPassword').value;
  const isAdmin = $('newIsAdmin').checked;
  if (!username || !displayName || !password) { toast('請填寫完整', 'error'); return; }
  if (password.length < 6) { toast('密碼至少 6 字', 'error'); return; }
  $('createBtn').disabled = true;
  const r = await api('/api/admin/leaders', { method: 'POST', body: { username, displayName, password, isAdmin } });
  $('createBtn').disabled = false;
  if (!r.ok) { toast(r.error, 'error'); return; }
  toast('已新增 ' + displayName, 'success');
  $('newUsername').value = ''; $('newDisplayName').value = ''; $('newPassword').value = ''; $('newIsAdmin').checked = false;
  loadLeaders();
};

async function resetPassword(id, name) {
  const newPassword = prompt('為「' + name + '」設定新密碼（至少 6 字）：', '');
  if (!newPassword) return;
  if (newPassword.length < 6) { alert('密碼至少 6 字'); return; }
  const r = await api('/api/admin/leaders/' + id + '/reset-password', { method: 'POST', body: { newPassword } });
  if (!r.ok) { toast(r.error, 'error'); return; }
  toast('密碼已重設', 'success');
}

async function deleteLeader(id, name) {
  if (!confirm('確定刪除「' + name + '」？\n該帳號歷史工單會保留，但失去關聯。')) return;
  const r = await api('/api/admin/leaders/' + id, { method: 'DELETE' });
  if (!r.ok) { toast(r.error, 'error'); return; }
  toast('已刪除', 'success');
  loadLeaders();
}

if (API_URL.startsWith('PASTE_')) {
  toast('尚未設定 API_URL，請先部署後端', 'error');
} else {
  loadLeaders();
}
</script>
</body>
</html>
