<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<title>上鎧鋼鐵 - 帳號管理</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://shangkai-manu-record.zeabur.app" crossorigin>
<link rel="dns-prefetch" href="https://shangkai-manu-record.zeabur.app">
<style>
  :root {
    --brand: #d23535;
    --brand-dark: #a82828;
    --brand-soft: #fdf2f2;
    --ink: #1c1c1e;
    --text: #2c2c2e;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --bg: #f2f2f5;
    --card: #ffffff;
    --success: #2ea043;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.04);
    position: relative;
    z-index: 10;
  }
  header .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    flex: 1;
  }
  header .brand img { height: 30px; width: auto; flex-shrink: 0; }
  header .brand-text {
    border-left: 2px solid var(--border);
    padding-left: 10px;
    line-height: 1.2;
    min-width: 0;
    flex: 1;
  }
  header .brand-text .title {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header .brand-text .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header .right { display: flex; gap: 2px; flex-shrink: 0; }
  header .right a {
    color: var(--brand);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    padding: 6px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  @media (max-width: 480px) {
    header .brand img { height: 26px; }
    header .brand-text { padding-left: 8px; }
    header .brand-text .title { font-size: 12px; }
    header .right a { font-size: 11px; padding: 5px 7px; }
  }
  header .right a:hover { background: var(--brand-soft); }

  .container { padding: 16px; max-width: 760px; margin: 0 auto; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.02);
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin: 12px 0 6px;
    font-weight: 500;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 13px 14px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--ink);
    transition: border-color .15s;
  }
  input[type=text]:focus, input[type=password]:focus {
    outline: none;
    border-color: var(--brand);
  }
  button {
    appearance: none;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
    font-family: inherit;
    transition: transform .08s, background .15s;
  }
  button:active { transform: scale(.98); }
  .btn-primary { background: var(--brand); color: #fff; box-shadow: 0 2px 6px rgba(210,53,53,.2); }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-secondary { background: #f2f2f5; color: var(--ink); border: 1.5px solid var(--border); }
  .btn-secondary:hover { background: #e8e8eb; }
  .btn-danger { background: #fff; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn-danger:hover { background: var(--brand-soft); }
  .btn-block { width: 100%; padding: 14px; margin-top: 8px; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 0;
    font-size: 14px;
    padding: 10px 12px;
    background: var(--bg);
    border-radius: 8px;
  }
  .checkbox-row input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--brand); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block;
    background: var(--brand);
    color: #fff;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-left: 4px;
  }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions button { padding: 7px 12px; font-size: 12px; }

  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28,28,30,.95);
    color: #fff;
    padding: 14px 22px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    display: none;
    max-width: 90%;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.2);
  }
  #toast.show { display: block; }
  #toast.error { background: var(--brand); }
  #toast.success { background: var(--success); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.jpg" alt="上鎧鋼鐵">
    <div class="brand-text">
      <div class="title">帳號管理</div>
      <div class="sub" id="meShow"></div>
    </div>
  </div>
  <div class="right">
    <a href="index.html">生產實態紀錄</a>
    <a href="records.html">紀錄</a>
    <a href="#" id="logoutLink">登出</a>
  </div>
</header>

<div class="container">

  <div class="card">
    <h2>新增小組長</h2>
    <label>帳號（只能英數，登入用，例：wang、lin01）</label>
    <input type="text" id="newUsername" autocapitalize="none" autocomplete="off" placeholder="例：wang" pattern="[a-zA-Z0-9_]+">
    <label>顯示名稱（中文，記錄到工單上的人名）</label>
    <input type="text" id="newDisplayName" placeholder="例：王大明">
    <label>密碼（至少 6 字）</label>
    <input type="password" id="newPassword" autocomplete="new-password">
    <div class="checkbox-row">
      <input type="checkbox" id="newIsAdmin">
      <label for="newIsAdmin" style="margin:0;">設為管理員</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="newIsPlanner">
      <label for="newIsPlanner" style="margin:0;">設為生管（可上傳工單）</label>
    </div>
    <button class="btn-primary btn-block" id="createBtn">新增帳號</button>
  </div>

  <div class="card">
    <h2>所有小組長</h2>
    <div id="leadersTable">載入中...</div>
  </div>

  <div class="card">
    <h2>已刪除工單（可救回）</h2>
    <p style="font-size:12px;color:var(--muted);margin:0 0 12px;">近期被誤刪的工單會出現在這裡，按「救回」可恢復工單與其生產紀錄。</p>
    <div id="trashTable">載入中...</div>
  </div>

  <div class="card">
    <h2>查單號歷史</h2>
    <p style="font-size:12px;color:var(--muted);margin:0 0 12px;">輸入工單號（可只輸入部分）查所有相關紀錄：含已刪除工單、含已取消批次。</p>
    <div style="display:flex;gap:8px;">
      <input type="text" id="findOrderInput" placeholder="例：F1159421004" autocapitalize="characters" autocomplete="off" style="flex:1;">
      <button class="btn-primary" id="findOrderBtn" style="white-space:nowrap;">查詢</button>
    </div>
    <div id="findOrderResult" style="margin-top:12px;"></div>
  </div>

  <div class="card">
    <h2>系統工具</h2>
    <button class="btn-primary btn-block" id="fixDatesBtn" style="margin-bottom:8px;">修正所有工單生產日期</button>
    <p style="font-size:12px;color:var(--muted);margin:0;">將所有工單的生產日期更新為第一筆實際活動的日期</p>
    <div id="fixDatesResult" style="margin-top:8px;"></div>
  </div>

</div>

<div id="toast"></div>

<script src="config.js"></script>
<script src="utils.js"></script>
<script>

const me = requireLogin();
if (me && !me.isAdmin) {
  alert('需要管理員權限');
  location.href = 'index.html';
}
if (me && !me.isAdmin) {
  alert('需要管理員權限');
  location.href = 'index.html';
}
if (me) $('meShow').textContent = '管理員：' + me.displayName;

$('logoutLink').onclick = e => {
  e.preventDefault();
  if (!confirm('登出？')) return;
  localStorage.removeItem('token');
  localStorage.removeItem('me');
  location.href = 'index.html';
};

async function loadLeaders() {
  const r = await api('/api/admin/leaders');
  if (!r.ok) { $('leadersTable').textContent = r.error || '載入失敗'; return; }
  const leaders = r.data.leaders;
  if (!leaders.length) { $('leadersTable').innerHTML = '<div style="color:#999;">尚無帳號</div>'; return; }
  const rows = leaders.map(l => `
    <tr>
      <td><strong>${escapeHtml(l.displayName)}</strong>${l.isAdmin ? ' <span class="badge">管理員</span>' : ''}${l.isPlanner ? ' <span class="badge" style="background:#f0ad4e;">生管</span>' : ''}<br><span style="color:#888;font-size:12px;">@${escapeHtml(l.username)}</span></td>
      <td style="font-size:12px;color:#666;">${fmtDate(l.createdAt)}</td>
      <td class="row-actions">
        <button class="btn-secondary" data-reset="${l.id}" data-name="${escapeHtml(l.displayName)}">改密碼</button>
        ${l.id === me.id ? '' : `<button class="btn-danger" data-delete="${l.id}" data-name="${escapeHtml(l.displayName)}">刪除</button>`}
      </td>
    </tr>
  `).join('');
  $('leadersTable').innerHTML = `<table><thead><tr><th>姓名 / 帳號</th><th>建立日期</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;

  $('leadersTable').querySelectorAll('[data-reset]').forEach(b => {
    b.onclick = () => resetPassword(b.dataset.reset, b.dataset.name);
  });
  $('leadersTable').querySelectorAll('[data-delete]').forEach(b => {
    b.onclick = () => deleteLeader(b.dataset.delete, b.dataset.name);
  });
}

initDropdownMenu();

$('createBtn').onclick = async () => {
  const username = $('newUsername').value.trim();
  const displayName = $('newDisplayName').value.trim();
  const password = $('newPassword').value;
  const isAdmin = $('newIsAdmin').checked;
  const isPlanner = $('newIsPlanner').checked;
  if (!username || !displayName || !password) { toast('請填寫完整', 'error'); return; }
  if (!/^[a-zA-Z0-9_]+$/.test(username)) { toast('帳號只能用英數和底線', 'error'); return; }
  if (password.length < 6) { toast('密碼至少 6 字', 'error'); return; }
  $('createBtn').disabled = true;
  const r = await api('/api/admin/leaders', { method: 'POST', body: { username, displayName, password, isAdmin, isPlanner } });
  $('createBtn').disabled = false;
  if (!r.ok) { toast(r.error, 'error'); return; }
  toast('已新增 ' + displayName, 'success');
  $('newUsername').value = ''; $('newDisplayName').value = ''; $('newPassword').value = ''; $('newIsAdmin').checked = false; $('newIsPlanner').checked = false;
  loadLeaders();
};

async function resetPassword(id, name) {
  const newPassword = prompt('為「' + name + '」設定新密碼（至少 6 字）：', '');
  if (!newPassword) return;
  if (newPassword.length < 6) { alert('密碼至少 6 字'); return; }
  const r = await api('/api/admin/leaders/' + id + '/reset-password', { method: 'POST', body: { newPassword } });
  if (!r.ok) { toast(r.error, 'error'); return; }
  toast('密碼已重設', 'success');
}

async function deleteLeader(id, name) {
  if (!confirm('確定刪除「' + name + '」？\n該帳號歷史工單會保留，但失去關聯。')) return;
  const r = await api('/api/admin/leaders/' + id, { method: 'DELETE' });
  if (!r.ok) { toast(r.error, 'error'); return; }
  toast('已刪除', 'success');
  loadLeaders();
}

function fmtDateTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const ymd = d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0');
  const hm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return ymd + ' ' + hm;
}

async function loadTrash() {
  const r = await api('/api/orders/trash');
  if (!r.ok) { $('trashTable').textContent = r.error || '載入失敗'; return; }
  const orders = r.data.orders || [];
  if (!orders.length) {
    $('trashTable').innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px 0;">目前沒有已刪除的工單</div>';
    return;
  }
  const rows = orders.map(o => {
    const spec = [o.productSpec, o.moldSpec].filter(Boolean).join(' / ') || '—';
    const leaderName = (o.leader && o.leader.displayName) || '—';
    return `
      <tr>
        <td><strong>${escapeHtml(o.orderNo)}</strong><br><span style="color:#888;font-size:12px;">${escapeHtml(spec)}</span></td>
        <td style="font-size:12px;color:#666;">${fmtDateTime(o.deletedAt)}<br><span style="color:#888;">原負責：${escapeHtml(leaderName)}</span></td>
        <td class="row-actions">
          <button class="btn-primary" data-restore="${escapeHtml(o.orderNo)}">救回</button>
        </td>
      </tr>
    `;
  }).join('');
  $('trashTable').innerHTML = `<table><thead><tr><th>工單 / 規格</th><th>刪除時間</th><th>操作</th></tr></thead><tbody>${rows}</tbody></table>`;
  $('trashTable').querySelectorAll('[data-restore]').forEach(b => {
    b.onclick = () => restoreOrder(b.dataset.restore);
  });
}

async function restoreOrder(orderNo) {
  if (!confirm('確定救回工單「' + orderNo + '」？\n工單與其生產紀錄都會一起恢復。')) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/restore', { method: 'POST' });
  if (!r.ok) { toast(r.error || '救回失敗', 'error'); return; }
  const entries = r.data.entries || 0;
  const pauses = r.data.pauses || 0;
  const detail = (entries || pauses) ? `（含工序 ${entries} 筆、停機 ${pauses} 筆）` : '';
  toast('已救回 ' + orderNo + detail, 'success');
  loadTrash();
}

async function findOrderNo() {
  const q = $('findOrderInput').value.trim().toUpperCase();
  if (!q) { toast('請輸入單號（或部分）', 'error'); return; }
  $('findOrderBtn').disabled = true;
  const r = await api('/api/admin/find-orderno?q=' + encodeURIComponent(q));
  $('findOrderBtn').disabled = false;
  if (!r.ok) { $('findOrderResult').innerHTML = '<span style="color:var(--brand);">' + (r.error || '查詢失敗') + '</span>'; return; }
  const orders = r.data.orders || [];
  const uploadRows = r.data.uploadRows || [];
  if (orders.length === 0 && uploadRows.length === 0) {
    $('findOrderResult').innerHTML = '<div style="color:var(--muted);padding:8px 0;">查無此單號（DB 跟所有上傳批次裡都沒有）</div>';
    return;
  }
  let html = '';
  if (orders.length > 0) {
    html += '<h3 style="margin:8px 0;font-size:13px;color:var(--muted);">工單表（' + orders.length + ' 筆）</h3>';
    html += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px;">';
    html += '<table style="min-width:640px;"><thead><tr><th>工單號</th><th>機台 / 規格</th><th>狀態</th><th>建立 / 更新</th><th>操作</th></tr></thead><tbody>';
    orders.forEach(o => {
      const status = o.deletedAt
        ? '<span style="color:var(--brand);">已刪除 ' + fmtDateTime(o.deletedAt) + '</span>'
        : '<span style="color:var(--success);">使用中</span>';
      const spec = [o.productSpec, o.moldSpec, o.material].filter(Boolean).join(' / ') || '—';
      const machine = (o.machineNo || '—') + (o.plannedMachineNo && o.plannedMachineNo !== o.machineNo ? '（原計劃 ' + escapeHtml(o.plannedMachineNo) + '）' : '');
      const action = o.deletedAt
        ? '<button class="btn-secondary" data-restore="' + escapeHtml(o.orderNo) + '" style="padding:6px 12px;font-size:12px;">救回</button>'
        : '<div style="display:flex;gap:4px;flex-wrap:wrap;">'
          + '<button class="btn-danger" data-finddel="' + escapeHtml(o.orderNo) + '" style="padding:6px 10px;font-size:12px;">刪除</button>'
          + '<button data-finddel-force="' + escapeHtml(o.orderNo) + '" style="padding:6px 10px;font-size:12px;background:var(--brand);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">徹底刪除</button>'
          + '</div>';
      html += '<tr>'
        + '<td><strong>' + escapeHtml(o.orderNo) + '</strong></td>'
        + '<td><div>' + escapeHtml(machine) + '</div><div style="color:#888;font-size:12px;">' + escapeHtml(spec) + '</div></td>'
        + '<td>' + status + '</td>'
        + '<td style="font-size:12px;color:#666;">建：' + fmtDateTime(o.createdAt) + '<br>更：' + fmtDateTime(o.updatedAt) + '</td>'
        + '<td>' + action + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  }
  if (uploadRows.length > 0) {
    html += '<h3 style="margin:16px 0 8px;font-size:13px;color:var(--muted);">上傳記錄（' + uploadRows.length + ' 筆，含已取消批次）</h3>';
    html += '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px;">';
    html += '<table style="min-width:720px;"><thead><tr><th>檔名 / 上傳人</th><th>單號 / 規格</th><th>處理</th><th>批次狀態</th><th>批次時間</th></tr></thead><tbody>';
    uploadRows.forEach(u => {
      const b = u.batch || {};
      const cancelled = b.cancelledAt
        ? '<span style="color:var(--brand);white-space:nowrap;">已取消<br><span style="font-size:11px;">' + fmtDateTime(b.cancelledAt) + '</span></span>'
        : '<span style="color:var(--success);white-space:nowrap;">有效</span>';
      // status 簡化顯示：error 簡短標示「失敗」並用 title 帶完整訊息（hover 看）
      let rowStatus;
      if (u.status === 'error') {
        const msg = String(u.errorMsg || '').slice(0, 200);
        rowStatus = '<span style="color:var(--brand);font-size:11px;background:#fdf2f2;padding:2px 6px;border-radius:4px;" title="' + escapeHtml(msg) + '">失敗</span>';
      } else if (u.status === 'created') {
        rowStatus = '<span style="color:var(--success);font-size:11px;">新建</span>';
      } else if (u.status === 'updated') {
        rowStatus = '<span style="color:#1f6feb;font-size:11px;">更新</span>';
      } else if (u.status === 'skipped') {
        rowStatus = '<span style="color:#f0ad4e;font-size:11px;" title="' + escapeHtml(u.errorMsg || '') + '">跳過</span>';
      } else {
        rowStatus = '<span style="font-size:11px;">' + escapeHtml(u.status) + '</span>';
      }
      const spec = [u.productSpec, u.moldSpec, u.material].filter(Boolean).join(' / ') || '—';
      html += '<tr>'
        + '<td style="white-space:nowrap;"><div>' + escapeHtml(b.filename || '?') + '</div><div style="color:#888;font-size:12px;">' + escapeHtml(b.uploadedByName || '—') + '</div></td>'
        + '<td><div><strong>' + escapeHtml(u.orderNo) + '</strong></div><div style="color:#888;font-size:12px;">' + escapeHtml(spec) + '</div></td>'
        + '<td>' + rowStatus + '</td>'
        + '<td>' + cancelled + '</td>'
        + '<td style="font-size:12px;color:#666;white-space:nowrap;">' + fmtDateTime(b.uploadedAt) + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  }
  $('findOrderResult').innerHTML = html;
  $('findOrderResult').querySelectorAll('[data-finddel]').forEach(b => {
    b.onclick = () => deleteOrderFromFind(b.dataset.finddel);
  });
  $('findOrderResult').querySelectorAll('[data-finddel-force]').forEach(b => {
    b.onclick = () => forceDeleteOrderFromFind(b.dataset.finddelForce);
  });
  $('findOrderResult').querySelectorAll('[data-restore]').forEach(b => {
    b.onclick = () => restoreOrder(b.dataset.restore);
  });
}

async function forceDeleteOrderFromFind(orderNo) {
  if (!confirm('⚠️ 徹底刪除工單「' + orderNo + '」？\n\n會連同所有工序紀錄、暫停紀錄一起軟刪除。\n（仍可從「已刪除工單」區塊救回）')) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '?force=true', { method: 'DELETE' });
  if (!r.ok) { toast(r.error || '刪除失敗', 'error'); return; }
  const detail = (r.data.entries || r.data.pauses)
    ? '（含工序 ' + (r.data.entries || 0) + ' 筆、停機 ' + (r.data.pauses || 0) + ' 筆）'
    : '';
  toast('已徹底刪除 ' + orderNo + detail, 'success');
  findOrderNo();
  loadTrash();
}

async function deleteOrderFromFind(orderNo) {
  if (!confirm('確定刪除工單「' + orderNo + '」？\n\n⚠️ 此動作無法復原（但可從「已刪除工單」區塊救回）。')) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo), { method: 'DELETE' });
  if (r.ok) {
    toast('已刪除 ' + orderNo, 'success');
    findOrderNo();
    loadTrash();
    return;
  }
  if (r.status === 409 && r.data && r.data.code === 'HAS_PRODUCTION_DATA') {
    if (!r.data.canReset) { toast(r.error, 'error'); return; }
    const info = '工單「' + orderNo + '」已有生產紀錄：\n  ・工序紀錄 ' + (r.data.entryCount || 0) + ' 筆\n  ・停機紀錄 ' + (r.data.pauseCount || 0) + ' 筆\n\n是否改為「重設生產紀錄」？';
    if (!confirm(info)) return;
    const r2 = await api('/api/orders/' + encodeURIComponent(orderNo) + '/reset-production', { method: 'POST' });
    if (!r2.ok) { toast(r2.error || '重設失敗', 'error'); return; }
    toast('已重設 ' + orderNo, 'success');
    findOrderNo();
    return;
  }
  toast(r.error || '刪除失敗', 'error');
}

$('findOrderBtn').onclick = findOrderNo;
$('findOrderInput').addEventListener('keydown', e => { if (e.key === 'Enter') findOrderNo(); });

$('fixDatesBtn').onclick = async () => {
  if (!confirm('確定修正所有工單的生產日期？\n\n將根據第一筆實際活動時間重新設定。')) return;
  $('fixDatesBtn').disabled = true;
  $('fixDatesBtn').textContent = '修正中...';
  const r = await api('/api/fix-dates', { method: 'POST', body: {} });
  $('fixDatesBtn').disabled = false;
  $('fixDatesBtn').textContent = '修正所有工單生產日期';
  if (!r.ok) { toast(r.error || '修正失敗', 'error'); return; }
  $('fixDatesResult').innerHTML = `<span style="color:var(--success);font-weight:600;">✓ 完成：共 ${r.data.total} 筆工單，修正了 ${r.data.fixed} 筆</span>`;
  toast('修正完成', 'success');
};

if (API_URL.startsWith('PASTE_')) {
  toast('尚未設定 API_URL，請先部署後端', 'error');
} else {
  loadLeaders();
  loadTrash();
}
</script>
