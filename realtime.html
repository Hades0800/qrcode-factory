<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#d23535">
<title>上鎧鋼鐵 - 即時生產</title>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://shangkai-manu-record.zeabur.app" crossorigin>
<link rel="dns-prefetch" href="https://shangkai-manu-record.zeabur.app">
<style>
  :root {
    --brand: #d23535;
    --brand-dark: #a82828;
    --brand-soft: #fdf2f2;
    --ink: #1c1c1e;
    --text: #2c2c2e;
    --muted: #6e6e73;
    --border: #e5e5ea;
    --bg: #f2f2f5;
    --card: #ffffff;
    --success: #2ea043;
    --success-soft: #e6f7ea;
    --safe-top: env(safe-area-inset-top, 0);
    --safe-bottom: env(safe-area-inset-bottom, 0);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    zoom: 1.15;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    padding-top: calc(10px + var(--safe-top));
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  header .brand img { height: 28px; width: auto; flex-shrink: 0; }
  header .brand-text { border-left: 2px solid var(--border); padding-left: 10px; }
  header .brand-text .title { font-size: 13px; font-weight: 700; color: var(--ink); white-space: nowrap; }
  header .brand-text .sub { font-size: 10px; color: var(--muted); white-space: nowrap; }
  .menu-toggle {
    background: none; border: none; font-size: 22px; color: var(--ink);
    cursor: pointer; padding: 6px 10px; border-radius: 8px; min-height: 36px;
    display: flex; align-items: center; flex-shrink: 0;
  }
  .dropdown-menu {
    display: none; position: fixed; top: 56px; right: 8px;
    background: #fff; border-radius: 12px; min-width: 170px; z-index: 999; padding: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.04);
  }
  .dropdown-menu.show { display: block; }
  .dropdown-menu a {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    font-size: 15px; font-weight: 600; color: var(--text);
    text-decoration: none; border-radius: 8px;
  }
  .dropdown-menu a:hover { background: var(--bg); }
  .dropdown-menu a.nav-active { color: var(--brand); background: var(--brand-soft); }
  .dropdown-menu .menu-sep { height: 1px; background: var(--border); margin: 4px 8px; }
  .dropdown-menu a.menu-logout { color: var(--muted); }

  /* Machine tabs — chip 列，可橫向滑動 */
  .machine-tabs {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
    background: #fff;
    border-bottom: 1px solid var(--border);
    scrollbar-width: none;
  }
  .machine-tabs::-webkit-scrollbar { display: none; }
  .machine-tab {
    flex: 0 0 auto;
    padding: 8px 16px;
    text-align: center;
    cursor: pointer;
    border: 1.5px solid transparent;
    border-radius: 999px;
    transition: background .15s, color .15s, transform .1s;
    min-width: 64px;
    font-family: inherit;
    background: #f0f0f3;
    font-size: 13px;
    color: #8e8e93;
  }
  .machine-tab:active { transform: scale(0.96); }
  .machine-tab .mt-num { font-size: 15px; font-weight: 800; line-height: 1.1; }
  .machine-tab .mt-spec { font-size: 10px; opacity: .85; line-height: 1.2; margin-top: 1px; }
  .machine-tab.active {
    background: var(--brand);
    color: #fff;
    border-color: var(--brand);
    box-shadow: 0 2px 8px rgba(232, 65, 51, .28);
  }
  .machine-tab.idle {
    opacity: .45;
  }
  .machine-tab.idle .mt-spec::after {
    content: " 無工令";
    color: inherit;
    opacity: .75;
  }
  /* 全機台匯總 tab — 跟機台 tab 有區隔 */
  .machine-tab.tab-all {
    background: #e7f0ff;
    color: #1f6feb;
    border-color: #c5dafe;
    margin-left: 4px;
  }
  .machine-tab.tab-all.active {
    background: #1f6feb;
    color: #fff;
    border-color: #1f6feb;
    box-shadow: 0 2px 8px rgba(31, 111, 235, .3);
  }

  /* Content area */
  .content {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px;
    padding-bottom: calc(14px + var(--safe-bottom));
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.02);
  }
  .card h3 {
    margin: 0 0 12px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .stat {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
  }
  .stat .s-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat .s-value { font-size: 22px; font-weight: 800; color: var(--ink); }
  .stat .s-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat.highlight { background: var(--brand-soft); }
  .stat.highlight .s-value { color: var(--brand); }
  .stat.good { background: var(--success-soft); }
  .stat.good .s-value { color: var(--success); }

  /* Order card */
  .order-card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.02);
    border-left: 4px solid var(--border);
  }
  .order-card.active { border-left-color: var(--brand); }
  .order-card .oc-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .order-card .oc-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .order-card .oc-no {
    font-size: 18px;
    font-weight: 800;
    color: var(--ink);
    min-width: 0;
    word-break: break-all;
  }
  .order-card.active .oc-no { color: var(--brand); }
  .order-card .oc-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 10px;
    background: var(--border);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .5px;
    flex-shrink: 0;
  }
  .order-card.active .oc-badge { background: var(--brand); color: #fff; }
  .order-card .oc-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .order-card .oc-pill {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    line-height: 1.4;
    letter-spacing: .5px;
    white-space: nowrap;
  }
  .order-card .oc-pill.scope { background: #fff3cd; color: #b8860b; border: 1.5px solid #f0ad4e; }
  .order-card .oc-pill.carryover { background: #f0ad4e; color: #fff; }

  /* 工單摘要條 — 橫向 meta 條，跟訂單規格的卡片視覺刻意切開 */
  .order-info {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    padding: 10px 12px;
    margin-bottom: 12px;
    background: linear-gradient(180deg, #fafafb 0%, #f5f5f7 100%);
    border-radius: 10px;
    border: 1px solid #e8e8eb;
    font-size: 12px;
  }
  .order-info .oi-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    line-height: 1.4;
  }
  .order-info .oi-icon { font-size: 14px; opacity: .85; }
  .order-info .oi-label { color: var(--muted); font-weight: 500; }
  .order-info .oi-value { color: var(--ink); font-weight: 700; }
  .order-info .oi-factor { color: var(--brand); font-size: 11px; font-weight: 700; margin-left: 2px; }

  /* Spec cards - horizontal scroll */
  .spec-cards-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    margin: 0 -16px 12px;
    padding: 0 16px;
  }
  .spec-cards-wrap::-webkit-scrollbar { display: none; }
  .spec-cards {
    display: flex;
    gap: 10px;
    min-width: min-content;
  }
  .spec-card {
    flex: 0 0 auto;
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 140px;
  }
  .spec-card .sc-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .spec-card .sc-value {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    word-break: break-all;
    line-height: 1.3;
  }
  .spec-card.wide { min-width: 220px; }
  .spec-stats {
    display: flex;
    gap: 8px;
    flex: 0 0 auto;
  }
  .spec-stat {
    background: var(--bg);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
    min-width: 80px;
    flex: 0 0 auto;
  }
  .spec-stat .ss-label { font-size: 10px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .spec-stat .ss-value { font-size: 18px; font-weight: 800; color: var(--ink); }
  .spec-stat .ss-unit { font-size: 11px; color: var(--muted); font-weight: 500; }
  @media (min-width: 768px) {
    .spec-cards-wrap { overflow-x: visible; margin: 0 0 12px; padding: 0; }
    .spec-cards { flex-wrap: wrap; }
    .spec-card { flex: 1 1 auto; min-width: 160px; }
    .spec-card.wide { flex: 2 1 auto; }
    .spec-stats { flex-wrap: wrap; }
    .spec-stat { flex: 1 1 0; min-width: 0; }
    .spec-multi-grid {
      display: grid;
      grid-template-columns: repeat(var(--ms-cols, 4), minmax(0, 280px));
      gap: 12px;
    }
    .spec-multi-grid > div { min-width: 0; max-width: none; }
  }

  /* Timeline */
  .timeline { padding-left: 0; margin: 0; list-style: none; }
  .timeline li {
    position: relative;
    padding-left: 28px;
    padding-bottom: 14px;
    font-size: 13px;
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 22px;
    bottom: 0;
    width: 2px;
    background: var(--border);
  }
  .timeline li:last-child::before { display: none; }
  .timeline li .tl-dot {
    position: absolute;
    left: 2px;
    top: 4px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--border);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--border);
  }
  .timeline li.done .tl-dot { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
  .timeline li.current .tl-dot { background: var(--brand); box-shadow: 0 0 0 2px var(--brand); animation: pulse 1.5s infinite; }
  .timeline li .tl-time {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }
  .timeline li.current .tl-time { color: var(--brand); font-weight: 700; }
  .timeline li .tl-label {
    color: var(--ink);
    margin-top: 2px;
    font-weight: 500;
  }
  .timeline li.current .tl-label { color: var(--brand); font-weight: 700; }
  .timeline li.pause-event,
  .timeline li.abnormal-event,
  .timeline li.resume-event {
    margin-left: 20px;
    padding-left: 28px;
    border-left: 2px dashed var(--border);
    border-radius: 0;
  }
  .timeline li.pause-event::before,
  .timeline li.abnormal-event::before,
  .timeline li.resume-event::before {
    left: 8px;
  }
  .timeline li.pause-event .tl-dot,
  .timeline li.abnormal-event .tl-dot,
  .timeline li.resume-event .tl-dot {
    left: 2px;
  }
  .timeline li.pause-event .tl-dot { background: #f0ad4e; box-shadow: 0 0 0 2px #f0ad4e; }
  .timeline li.pause-event .tl-time { color: #b8860b; }
  .timeline li.pause-event .tl-label { color: #b8860b; font-weight: 600; }
  .timeline li.abnormal-event .tl-dot { background: var(--brand); box-shadow: 0 0 0 2px var(--brand); }
  .timeline li.abnormal-event .tl-time { color: var(--brand); }
  .timeline li.abnormal-event .tl-label { color: var(--brand); font-weight: 600; }
  .timeline li.resume-event .tl-dot { background: var(--success); box-shadow: 0 0 0 2px var(--success); }
  .timeline li.resume-event .tl-time { color: var(--success); }
  .timeline li.resume-event .tl-label { color: var(--success); font-style: italic; }
  .timeline li.spec-change {
    padding-left: 0;
    padding-top: 8px;
    padding-bottom: 12px;
    margin: 6px 0;
    border-top: 2px dashed #f0ad4e;
    background: linear-gradient(to bottom, #fff8e8 0%, transparent 100%);
  }
  .timeline li.spec-change::before { display: none; }
  .timeline li.spec-change .tl-dot { display: none; }
  .timeline li.spec-change .tl-time { color: #b8860b; }
  .timeline li.spec-change .tl-label { color: #b8860b; font-weight: 700; font-size: 13px; }
  .timeline li.day-divider {
    padding-left: 0;
    padding-bottom: 10px;
    padding-top: 4px;
    text-align: left;
    font-size: 12px;
    font-weight: 700;
    color: var(--brand);
  }
  .timeline li.day-divider::before { display: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }

  .overview-card .overview-body {
    transition: max-height .3s ease, opacity .2s ease;
    max-height: 600px;
    overflow: hidden;
  }
  .overview-card.collapsed .overview-body {
    max-height: 0;
    opacity: 0;
  }
  .overview-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .overview-toggle .toggle-icon {
    font-size: 12px;
    color: var(--muted);
    transition: transform .2s;
  }
  .overview-card.collapsed .toggle-icon { transform: rotate(180deg); }

  .empty-msg { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }

  @media (max-width: 480px) {
    header .brand img { height: 24px; }
    header .brand-text .title { font-size: 12px; }
    header .right a { font-size: 11px; padding: 5px 6px; }
    .machine-tabs { padding: 8px 10px; gap: 6px; }
    .machine-tab { padding: 7px 12px; min-width: 56px; }
    .machine-tab .mt-num { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.jpg" alt="上鎧鋼鐵">
    <div class="brand-text">
      <div class="title">即時生產</div>
      <div class="sub" id="meShow"></div>
    </div>
  </div>
  <button class="menu-toggle" id="menuBtn" onclick="document.getElementById('dropMenu').classList.toggle('show')"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
  <div class="dropdown-menu" id="dropMenu">
    <a href="index.html">生產實態紀錄</a>
    <a href="records.html">📊 紀錄</a>
    <a href="realtime.html" class="nav-active">⚡ 即時</a>
    <a href="upload.html" id="uploadLink" style="display:none;">📤 上傳</a>
    <a href="admin.html" id="adminLink" style="display:none;">⚙ 管理</a>
    <div class="menu-sep"></div>
    <a href="#" id="logoutLink" class="menu-logout">登出</a>
  </div>
</header>

<div class="machine-tabs" id="machineTabs"></div>

<div class="content" id="content">
  <div class="empty-msg">請選擇機台</div>
</div>

<script src="config.js"></script>
<script src="utils.js?v=20260520u"></script>
<script>
const MACHINES = [
  { id: 'No1-350', num: 'No1', spec: '350' },
  { id: 'No2-250', num: 'No2', spec: '250' },
  { id: 'No3-60',  num: 'No3', spec: '60' },
  { id: 'No4-90',  num: 'No4', spec: '90' },
  { id: 'No5-40',  num: 'No5', spec: '40' },
  { id: 'No6-40',  num: 'No6', spec: '40' },
];

// 機台目標統一從 utils.js 的 MACHINE_TARGETS 取
const MACHINE_STANDARDS = MACHINE_TARGETS;
const STEP_LABELS = [
  { key: 'step21At', label: '設備啓動準備' },
  { key: 'step22At', label: '生產準備完成' },
  { key: 'step23At', label: '生產無工令' },
  { key: 'step1At',  label: '原料準備與設置' },
  { key: 'step2At',  label: '模刀具準備與安裝' },
  { key: 'step3At',  label: '試模與規格品質確認' },
  { key: 'step4At',  label: '穩定連續生產-無中斷' },
  { key: 'step5At',  label: '穩定連續生產-中斷調整' },
  { key: 'step6At',  label: '後工程接續生產' },
  { key: 'step7At',  label: '其他作業' },
  { key: 'step11At', label: '生產作業完成終止' },
];

const me = requireLogin();
let allOrders = [];
let activeMachine = '';
let idleMachinesToday = new Set();
// 即時頁專用：只顯示 HH:MM
function fmtHM(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}

$('meShow').textContent = me ? me.displayName : '';
if (me && me.isAdmin) $('adminLink').style.display = 'flex';
if (me) $('uploadLink').style.display = 'flex';
$('logoutLink').onclick = e => { e.preventDefault(); localStorage.clear(); location.href = 'index.html'; };

// Machine tabs
function renderMachineTabs() {
  const machineHtml = MACHINES.map(m => {
    const isIdle = idleMachinesToday.has(m.id);
    return `<button class="machine-tab${activeMachine === m.id ? ' active' : ''}${isIdle ? ' idle' : ''}" data-m="${m.id}">
      <div class="mt-num">${m.num}</div>
      <div class="mt-spec">${m.spec}</div>
    </button>`;
  }).join('');
  // 在 No6 後面追加「全機台」匯總 tab
  const allHtml = `<button class="machine-tab tab-all${activeMachine === '__all' ? ' active' : ''}" data-m="__all">
    <div class="mt-num">全機台</div>
    <div class="mt-spec">本日匯總</div>
  </button>`;
  $('machineTabs').innerHTML = machineHtml + allHtml;
  $('machineTabs').querySelectorAll('.machine-tab').forEach(b => {
    b.onclick = () => {
      activeMachine = b.dataset.m;
      renderMachineTabs();
      lastRenderHash = ''; // 強制重畫（因為內容類型完全切換）
      renderContent();
    };
  });
}

const CACHE_RT = 'cache_rt_v1';

async function loadOrders() {
  // 先用快取立即顯示（減少等待感）
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_RT) || 'null');
    if (cached && cached.orders) {
      allOrders = cached.orders;
      idleMachinesToday = new Set(cached.idleMachines || []);
      renderMachineTabs();
      if (MACHINES.length > 0 && !activeMachine) activeMachine = MACHINES[0].id;
      renderMachineTabs();
      renderContent();
    }
  } catch (e) {}

  const [ordersRes, idleRes] = await Promise.all([
    api('/api/orders?limit=200'),
    api('/api/idle-events?limit=50'),
  ]);
  if (ordersRes.ok) allOrders = ordersRes.data.orders || [];
  if (idleRes.ok) {
    const now = new Date();
    idleMachinesToday = new Set((idleRes.data.events || []).filter(e => {
      const d = new Date(e.createdAt);
      return d.getFullYear() === now.getFullYear() &&
             d.getMonth() === now.getMonth() &&
             d.getDate() === now.getDate();
    }).map(e => e.machineNo));
  }
  // 寫入快取
  try {
    localStorage.setItem(CACHE_RT, JSON.stringify({
      orders: allOrders,
      idleMachines: Array.from(idleMachinesToday),
      savedAt: Date.now(),
    }));
  } catch (e) {}
  renderMachineTabs();
  if (MACHINES.length > 0 && !activeMachine) {
    activeMachine = MACHINES[0].id;
    renderMachineTabs();
  }
  renderContent();
}

// 上次 render 的資料指紋；相同代表畫面無需重畫，避免每 30 秒自動 refresh 導致畫面閃動 / scroll 位置重設
let lastRenderHash = '';
function renderContent() {
  const content = $('content');
  if (!activeMachine) {
    content.innerHTML = '<div class="empty-msg">請選擇機台</div>';
    lastRenderHash = '';
    return;
  }
  // 全機台本日匯總分支
  if (activeMachine === '__all') {
    content.innerHTML = renderAllMachinesSummary();
    return;
  }
  // 計算指紋：機台 + 各工單的關鍵欄位（updatedAt、stepEntries 數、暫停狀態、完成狀態）
  const fingerprint = activeMachine + '|' + idleMachinesToday.has(activeMachine) + '|' + (allOrders || []).map(o =>
    o.orderNo + ':' + (o.machineNo || '') + ':' + (o.updatedAt || '') + ':' + (o.step11At || '') +
    ':' + ((o.stepEntries || []).length) +
    ':' + (o.pause12 && o.pause12.active ? 'p12' : '') +
    ':' + (o.pause13 && o.pause13.active ? 'p13' : '') +
    ':' + (o.plannedMachineNo || '') +
    ':' + (o.specType || '') + ':' + (o.difficultyFactor || '') +
    ':' + (o.changeScope || '') + ':' + (o.materialType || '')
  ).join(';');
  if (fingerprint === lastRenderHash) return; // 資料無變化，跳過重畫，畫面與 scroll 位置維持原狀
  lastRenderHash = fingerprint;

  const m = MACHINES.find(x => x.id === activeMachine);
  const today = new Date();
  const dateStr = today.getFullYear() + '/' + String(today.getMonth()+1).padStart(2,'0') + '/' + String(today.getDate()).padStart(2,'0');

  // 顯示：今天有活動的工單 或 未完成的工單（有暫停中或有活動紀錄）
  function hasTodayActivity(o) {
    // 檢查是否有任何時間戳落在今天
    const times = [];
    ['step1At','step2At','step3At','step4At','step5At','step6At','step7At','step11At','step21At','step22At','step23At'].forEach(k => {
      if (o[k]) times.push(new Date(o[k]));
    });
    (o.stepEntries || []).forEach(e => { if (e.recordedAt) times.push(new Date(e.recordedAt)); });
    ((o.pause12 && o.pause12.history) || []).forEach(e => {
      if (e.startAt) times.push(new Date(e.startAt));
      if (e.endAt) times.push(new Date(e.endAt));
    });
    ((o.pause13 && o.pause13.history) || []).forEach(e => {
      if (e.startAt) times.push(new Date(e.startAt));
      if (e.endAt) times.push(new Date(e.endAt));
    });
    return times.some(t => isToday(t.toISOString()));
  }
  const machineOrders = allOrders
    .filter(o => o.machineNo === activeMachine)
    .filter(o => {
      if (isToday(o.productionDate)) return true;
      if (hasTodayActivity(o)) return true;
      // 未完成且暫停中的隔日工單
      if (!o.step11At && ((o.pause12 && o.pause12.active) || (o.pause13 && o.pause13.active))) return true;
      return false;
    })
    .sort((a, b) => {
      // 生產中（有活動且未完成）排最前
      const aActive = !a.step11At && hasAnyActivity(a) ? 1 : 0;
      const bActive = !b.step11At && hasAnyActivity(b) ? 1 : 0;
      if (aActive !== bActive) return bActive - aActive;
      return new Date(b.updatedAt) - new Date(a.updatedAt);
    });

  const totalOrders = machineOrders.length;
  const completedOrders = machineOrders.filter(o => o.step11At).length;

  // 生產產能 / 達成度
  // 實際生產重量（kg）= 已完成工單的 totalWeight 加總
  // 目標產能（kg/日）從機台標準表查
  const std = MACHINE_STANDARDS[activeMachine] || { capacityKg: 0, workMinutes: 0 };
  const doneWeight = machineOrders.filter(o => o.step11At).reduce((s, o) => s + (Number(o.totalWeight) || 0), 0);
  const capacityRate = std.capacityKg > 0 ? (doneWeight / std.capacityKg * 100).toFixed(1) : null;

  // 標準工時（分鐘）= 刀數 / SPM × 派工數
  // 累計今日該機台所有工單的標準工時（不再乘規格/原料係數，係數僅作為紀錄）
  const stdMinutes = machineOrders.reduce((s, o) => {
    const blades = Number(o.bladeCount) || 0;
    const spm = Number(o.machineSPM) || 0;
    const qty = Number(o.dispatchQty) || 0;
    if (blades > 0 && spm > 0 && qty > 0) {
      return s + (blades / spm * qty);
    }
    return s;
  }, 0);
  const efficiencyRate = std.workMinutes > 0 ? (stdMinutes / std.workMinutes * 100).toFixed(1) : null;

  const fmtNum = n => n > 0 ? n.toLocaleString('zh-TW', { maximumFractionDigits: 1 }) : '—';
  const fmtKg = kg => kg > 0 ? kg.toLocaleString('zh-TW', { maximumFractionDigits: 1 }) : '—';

  // Find active order (has any activity but no step11)
  const activeOrder = machineOrders.find(o => !o.step11At && hasAnyActivity(o));

  let html = '';

  // Stats
  html += `
    <div class="card overview-card" id="overviewCard">
      <div class="overview-toggle" onclick="document.getElementById('overviewCard').classList.toggle('collapsed')">
        <h3 style="margin-bottom:0;">機台概覽</h3>
        <span class="toggle-icon">▲</span>
      </div>
      <div class="overview-body">
      <div class="stats-grid" style="margin-top:12px;">
        <div class="stat">
          <div class="s-label">生產日期</div>
          <div class="s-value" style="font-size:16px;">${dateStr}</div>
        </div>
        <div class="stat ${idleMachinesToday.has(activeMachine) ? '' : 'highlight'}">
          <div class="s-label">機台編號</div>
          <div class="s-value" style="font-size:18px;">${escapeHtml(m.num)}-${escapeHtml(m.spec)}${idleMachinesToday.has(activeMachine) ? ' <span style="font-size:12px;color:var(--muted);background:#e5e5ea;padding:2px 8px;border-radius:10px;">今日無工令</span>' : ''}</div>
        </div>
        <div class="stat">
          <div class="s-label">今日工單數</div>
          <div class="s-value">${totalOrders}</div>
        </div>
        <div class="stat ${completedOrders > 0 ? 'good' : ''}">
          <div class="s-label">已完成</div>
          <div class="s-value">${completedOrders}</div>
          <div class="s-sub">/ ${totalOrders} 張</div>
        </div>
        <div class="stat">
          <div class="s-label">生產產能(kg)</div>
          <div class="s-value" style="font-size:18px;">${fmtKg(doneWeight)}${std.capacityKg > 0 ? ' <span style="font-size:13px;color:var(--muted);">/ ' + fmtKg(std.capacityKg) + '</span>' : ''}</div>
        </div>
        <div class="stat ${capacityRate && parseFloat(capacityRate) >= 100 ? 'good' : ''}">
          <div class="s-label">生產達成度</div>
          <div class="s-value">${capacityRate !== null ? capacityRate + '%' : '—'}</div>
        </div>
        <div class="stat">
          <div class="s-label">生產效率(分)</div>
          <div class="s-value" style="font-size:18px;">${fmtNum(stdMinutes)}${std.workMinutes > 0 ? ' <span style="font-size:13px;color:var(--muted);">/ ' + std.workMinutes + '</span>' : ''}</div>
        </div>
        <div class="stat ${efficiencyRate && parseFloat(efficiencyRate) >= 100 ? 'good' : ''}">
          <div class="s-label">效率達成度</div>
          <div class="s-value">${efficiencyRate !== null ? efficiencyRate + '%' : '—'}</div>
        </div>
      </div>
      </div>
    </div>
  `;

  // 本日匯總（當前機台）
  html += renderDailySummaryCard(activeMachine, machineOrders);


  // Orders
  if (machineOrders.length === 0) {
    html += '<div class="empty-msg">今天此機台尚無工單</div>';
  } else {
    machineOrders.forEach(o => {
      const isActive = activeOrder && o.orderNo === activeOrder.orderNo;
      const started = hasAnyActivity(o);
      const timeline = buildTimeline(o, me && me.isAdmin);
      const isCarryOver = o.productionDate && !isToday(o.productionDate);
      const carryOverTag = isCarryOver ? '<span class="oc-pill carryover">隔日生產</span>' : '';
      const scopeTag = o.changeScope ? `<span class="oc-pill scope">${escapeHtml(scopeLabel(o.changeScope))}</span>` : '';
      const hasTags = !!(carryOverTag || scopeTag);
      html += `
        <div class="order-card${isActive ? ' active' : ''}">
          <div class="oc-header">
            <div class="oc-title">
              <span class="oc-no">${escapeHtml(o.orderNo)}</span>
              <div class="oc-badge">${o.step11At ? '已完成' : (started ? '生產中' : '等待中')}</div>
            </div>
            ${hasTags ? `<div class="oc-tags">${scopeTag}${carryOverTag}</div>` : ''}
          </div>
          <div id="rt-spec-${escapeHtml(o.orderNo)}" class="rt-spec-area"></div>
          ${o.plannedMachineNo && o.plannedMachineNo !== o.machineNo ? `
          <div style="margin-bottom:8px;padding:6px 10px;background:#fff3cd;border-left:3px solid #f0ad4e;border-radius:4px;font-size:12px;color:#8a6d3b;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
            <span><strong>原計劃生產機台：</strong>${escapeHtml(o.plannedMachineNo)}</span>
            <button data-move-planned="${escapeHtml(o.orderNo)}" data-target="${escapeHtml(o.plannedMachineNo)}" style="padding:4px 10px;font-size:11px;background:#f0ad4e;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer;">移到 ${escapeHtml(o.plannedMachineNo)}</button>
          </div>` : ''}
          ${o.actualStartDate && o.plannedDate && String(o.actualStartDate).slice(0,10) !== String(o.plannedDate).slice(0,10) ? `
          <div style="margin-bottom:8px;padding:6px 10px;background:#fff3cd;border-left:3px solid #f0ad4e;border-radius:4px;font-size:12px;color:#8a6d3b;">
            <strong>計畫日期：</strong>${escapeHtml(String(o.plannedDate).slice(0,10))} <span style="color:#a98e44;">（實際開始 ${escapeHtml(String(o.actualStartDate).slice(0,10))}）</span>
          </div>` : ''}
          <div class="order-info">
            <span class="oi-item"><span class="oi-icon">${icon('user', 14)}</span><span class="oi-label">小組長</span><span class="oi-value">${escapeHtml(o.leaderName || '—')}</span></span>
            ${o.specType ? `<span class="oi-item"><span class="oi-icon">${icon(o.specType === 'new' ? 'sparkles' : 'box', 14)}</span><span class="oi-label">規格</span><span class="oi-value">${o.specType === 'new' ? escapeHtml(formatNewSpecLabel(o.newSpecAspects)) : '量產規格'}</span></span>` : ''}
            ${o.materialType ? `<span class="oi-item"><span class="oi-icon">${icon('layers', 14)}</span><span class="oi-label">原料</span><span class="oi-value">${o.materialType === 'coil' ? '捲料' : '板料'}</span></span>` : ''}
            ${o.auxEquipment ? `<span class="oi-item"><span class="oi-icon">${icon('gear', 14)}</span><span class="oi-label">輔助設備</span><span class="oi-value">${escapeHtml(auxEquipmentLabel(o.auxEquipment))}</span></span>` : ''}
          </div>
          <h3 style="margin:0 0 8px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;">生產實態</h3>
          <ul class="timeline">${timeline}</ul>
          <div style="margin-top:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--brand);" onclick="toggleRtEquipment('${escapeHtml(o.orderNo)}', this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>展開設備參數
          </div>
          <div class="rt-equipment-${escapeHtml(o.orderNo)}" style="display:none;background:var(--bg);border-radius:8px;padding:10px;margin-top:6px;"></div>
        </div>
      `;
    });
  }

  content.innerHTML = html;

  // 刪除單筆實態按鈕事件
  content.querySelectorAll('[data-del-entry]').forEach(b => {
    b.onclick = () => deleteEntry(b.getAttribute('data-del-entry'), b.getAttribute('data-order'));
  });
  // 移到原計劃機台
  content.querySelectorAll('[data-move-planned]').forEach(b => {
    b.onclick = () => moveToPlannedMachine(b.getAttribute('data-move-planned'), b.getAttribute('data-target'));
  });

  // 載入多規格卡片
  machineOrders.forEach(o => loadSpecCards(o));
}

async function loadSpecCards(o) {
  const area = document.getElementById('rt-spec-' + o.orderNo);
  if (!area) return;

  const r = await api('/api/orders/' + encodeURIComponent(o.orderNo) + '/upload-rows');
  const rows = (r.ok && r.data.rows) ? r.data.rows : [];
  const specs = rows.length > 0 ? rows : [{
    productSpec: o.productSpec, moldSpec: o.moldSpec, material: o.material,
    dispatchQty: o.dispatchQty, bladeCount: o.bladeCount, machineSPM: o.machineSPM,
    unitWeight: o.unitWeight, totalWeight: o.totalWeight,
  }];

  if (specs.length === 1) {
    const s = specs[0];
    area.innerHTML = `
      <div class="spec-cards-wrap"><div class="spec-cards">
        <div class="spec-card wide"><div class="sc-label">🔧 生產規格</div><div class="sc-value">${s.productSpec ? escapeHtml(s.productSpec) : '—'}</div></div>
        <div class="spec-card"><div class="sc-label">⚙ 模具</div><div class="sc-value">${s.moldSpec ? escapeHtml(s.moldSpec) : '—'}</div></div>
        <div class="spec-card"><div class="sc-label" style="display:inline-flex;align-items:center;gap:4px;">${icon('box', 12)}領料</div><div class="sc-value">${s.material ? escapeHtml(s.material) : '—'}</div></div>
      </div></div>
      <div class="spec-cards-wrap"><div class="spec-stats">
        <div class="spec-stat"><div class="ss-label">派工數</div><div class="ss-value">${s.dispatchQty || '—'}${s.dispatchQty ? '<span class="ss-unit">片</span>' : ''}</div></div>
        <div class="spec-stat"><div class="ss-label">刀數</div><div class="ss-value">${s.bladeCount || '—'}</div></div>
        <div class="spec-stat"><div class="ss-label">機器SPM</div><div class="ss-value">${s.machineSPM || '—'}</div></div>
        <div class="spec-stat"><div class="ss-label">一片理論重</div><div class="ss-value">${s.unitWeight || '—'}${s.unitWeight ? '<span class="ss-unit">kg</span>' : ''}</div></div>
        <div class="spec-stat"><div class="ss-label">全部總重量</div><div class="ss-value">${s.totalWeight || '—'}${s.totalWeight ? '<span class="ss-unit">kg</span>' : ''}</div></div>
      </div></div>`;
  } else {
    const cols = Math.min(specs.length, 4);
    area.innerHTML = `
      <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">${specs.length} 種規格</div>
      <div class="spec-cards-wrap"><div class="spec-cards spec-multi-grid" style="--ms-cols:${cols};">
        ${specs.map((s, i) => {
          const fields = [
            { label: '生產規格', value: s.productSpec, bold: true },
            { label: '模具', value: s.moldSpec },
            { label: '領料', value: s.material, alwaysShow: true },
            { label: '派工數', value: s.dispatchQty, unit: '片' },
            { label: '刀數', value: s.bladeCount },
            { label: 'SPM', value: s.machineSPM },
            { label: '單重', value: s.unitWeight, unit: 'kg' },
            { label: '總重', value: s.totalWeight, unit: 'kg' },
          ];
          const visible = fields.filter(f => f.value || f.alwaysShow);
          return '<div style="flex:0 0 auto;min-width:240px;max-width:320px;background:var(--bg);border-radius:12px;padding:14px;border-left:3px solid var(--brand);">' +
            '<div style="font-size:11px;color:var(--brand);font-weight:700;margin-bottom:8px;">規格 ' + (i+1) + '</div>' +
            visible.map(f => {
              const hasVal = f.value !== null && f.value !== undefined && f.value !== '';
              const valueText = hasVal ? escapeHtml(String(f.value)) : '—';
              const unitText = hasVal && f.unit ? ' <span style="color:var(--muted);font-size:11px;">' + f.unit + '</span>' : '';
              return '<div style="display:flex;gap:8px;padding:3px 0;font-size:13px;' + (f.bold ? 'margin-bottom:4px;' : '') + '">' +
                '<span style="color:var(--muted);font-weight:500;white-space:nowrap;min-width:50px;">' + f.label + '：</span>' +
                '<span style="color:' + (hasVal ? 'var(--ink)' : 'var(--muted)') + ';font-weight:' + (f.bold ? '700' : '600') + ';word-break:break-all;' + (f.bold ? 'font-size:14px;' : '') + '">' +
                  valueText + unitText +
                '</span>' +
              '</div>';
            }).join('') +
          '</div>';
        }).join('')}
      </div></div>`;
  }
}

async function moveToPlannedMachine(orderNo, target) {
  if (!confirm('確定將工單「' + orderNo + '」改到原計劃機台「' + target + '」？\n\n此操作會把目前機台改為 ' + target + '，並把此單從現在這個分頁移走。')) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/machine', {
    method: 'POST',
    body: { machineNo: target },
  });
  if (!r.ok) { toast(r.error || '改機台失敗', 'error'); return; }
  toast('已將 ' + orderNo + ' 改到 ' + target, 'success');
  loadOrders();
}

async function deleteEntry(entryId, orderNo) {
  if (!confirm('確定刪除這筆實態紀錄？')) return;
  const r = await api('/api/orders/' + encodeURIComponent(orderNo) + '/step-entries/' + entryId, { method: 'DELETE' });
  if (!r.ok) { toast(r.error || '刪除失敗', 'error'); return; }
  if (r.data && r.data.order) {
    const idx = allOrders.findIndex(o => o.orderNo === orderNo);
    if (idx >= 0) allOrders[idx] = r.data.order;
  }
  renderContent();
  toast('已刪除', 'success');
}

// 全機台本日匯總（給「全機台」分頁用）— 直接列每台機台的當日卡片，不再放頂部目標總表
function renderAllMachinesSummary() {
  const ymd = todayYmd();
  return MACHINES.map(m => {
    const list = (allOrders || []).filter(o => o.machineNo === m.id && orderIsOnDate(o, ymd));
    if (list.length === 0) {
      return `<div class="card" style="margin-bottom:12px;opacity:.6;">
        <h3 style="margin:0 0 4px;">${escapeHtml(m.id)}</h3>
        <div style="font-size:12px;color:var(--muted);">今天無工單</div>
      </div>`;
    }
    return renderDailySummaryCard(m.id, list);
  }).join('');
}

// 本日匯總（單一機台）
function renderDailySummaryCard(machineId, machineOrders) {
  const ymd = todayYmd();
  const todayOrders = (machineOrders || []).filter(o => orderIsOnDate(o, ymd));
  if (todayOrders.length === 0) return '';
  const t = MACHINE_TARGETS[machineId] || { workMinutes: 0, prepMinutes: 0 };
  const rows = todayOrders.map(o => {
    const p = computeOrderPhasesForDay(o, ymd);
    return { orderNo: o.orderNo, isCrossDay: isCrossDayOrder(o, ymd), ...p };
  });
  // 隔日生產的工單排到最前面，其他維持原順序
  rows.sort((a, b) => (a.isCrossDay === b.isCrossDay) ? 0 : (a.isCrossDay ? -1 : 1));
  const sumPrep = rows.reduce((s, r) => s + r.prepSec, 0);
  const sumProd = rows.reduce((s, r) => s + r.prodSec, 0);
  const sumAbn  = rows.reduce((s, r) => s + r.abnSec,  0);
  const prepMin = Math.round(sumPrep / 60);
  const prodMin = Math.round(sumProd / 60);
  const abnMin  = Math.round(sumAbn  / 60);
  // 準備望小（越快越好）→ 用 target/actual；實績望大 → 用 actual/target
  const prepRate = (t.prepMinutes > 0 && prepMin > 0) ? (t.prepMinutes / prepMin * 100).toFixed(1) : '—';
  const prodRate = t.workMinutes > 0 ? (prodMin / t.workMinutes * 100).toFixed(1) : '—';

  // 生產效益率 = 生產實績 / 生產準備（比值，小數 2 位，例：1.40）
  // 對照各機台目標：1.40 (No1) / 0.78 (No2) / 2.00 (No3, No4) / 7.00 (No5, No6)
  const effRate = (prepMin, prodMin) => prepMin > 0 ? (prodMin / prepMin).toFixed(2) : '—';
  const targetEff = (t.prepMinutes > 0 && t.workMinutes > 0) ? (t.workMinutes / t.prepMinutes).toFixed(2) : null;
  // 低於目標 → 紅字（用品牌紅）；達標或無目標 → 藍字；無準備 → 灰字
  const effColor = (prepMin, prodMin) => {
    if (prepMin <= 0) return 'var(--muted)';
    if (!targetEff) return '#1f6feb';
    return (prodMin / prepMin) < parseFloat(targetEff) ? 'var(--brand)' : '#1f6feb';
  };
  const rowsHtml = rows.map(r => {
    const rPrep = Math.round(r.prepSec / 60);
    const rProd = Math.round(r.prodSec / 60);
    return `
    <tr>
      <td style="padding:6px 8px;font-weight:700;font-size:12px;">${escapeHtml(r.orderNo)}${r.isCrossDay ? '<span style="display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:#fff8e8;color:#b8860b;margin-left:4px;">隔日</span>' : ''}${renderOrderStatusBadge(r.status)}</td>
      <td style="padding:6px 8px;font-family:monospace;font-size:13px;text-align:center;">${rPrep}</td>
      <td style="padding:6px 8px;font-family:monospace;font-size:13px;text-align:center;">${rProd}</td>
      <td style="padding:6px 8px;font-family:monospace;font-size:13px;text-align:center;font-weight:600;color:${effColor(rPrep, rProd)};">${effRate(rPrep, rProd)}</td>
      <td style="padding:6px 8px;font-family:monospace;font-size:13px;text-align:center;">${Math.round(r.abnSec / 60)}</td>
    </tr>
  `;
  }).join('');

  return `
    <div class="card" style="margin-bottom:12px;">
      <h3 style="margin:0 0 4px;">本日匯總 · ${escapeHtml(machineId)}</h3>
      <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">
        目標 — 生產準備 ${t.prepMinutes} 分／生產實績 ${t.workMinutes} 分${targetEff ? '／生產效益率 ' + targetEff : ''}
      </div>
      <div style="overflow-x:auto;border:1px solid var(--border);border-radius:8px;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:500px;">
        <thead style="background:#f5f5f7;">
          <tr>
            <th style="padding:8px;text-align:left;font-weight:700;">工單</th>
            <th style="padding:8px;text-align:center;font-weight:700;color:#1f6feb;">生產準備(分)</th>
            <th style="padding:8px;text-align:center;font-weight:700;color:#1f6feb;">生產實績(分)</th>
            <th style="padding:8px;text-align:center;font-weight:700;color:#1f6feb;">生產效益率</th>
            <th style="padding:8px;text-align:center;font-weight:700;color:var(--brand);">異常停線(分)</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot style="background:#fafafb;">
          <tr style="border-top:1.5px solid var(--border);">
            <td style="padding:6px 8px;font-weight:700;color:var(--muted);font-size:12px;">合計（分）</td>
            <td style="padding:6px 8px;font-family:monospace;font-weight:800;text-align:center;color:var(--brand);">${prepMin}</td>
            <td style="padding:6px 8px;font-family:monospace;font-weight:800;text-align:center;color:var(--brand);">${prodMin}</td>
            <td style="padding:6px 8px;font-family:monospace;font-weight:800;text-align:center;${targetEff && effRate(prepMin, prodMin) !== '—' && parseFloat(effRate(prepMin, prodMin)) >= parseFloat(targetEff) ? 'color:var(--success);' : 'color:var(--brand);'}">${effRate(prepMin, prodMin)}${targetEff ? ' / ' + targetEff : ''}</td>
            <td style="padding:6px 8px;font-family:monospace;font-weight:800;text-align:center;color:var(--brand);">${abnMin}</td>
          </tr>
          <tr>
            <td style="padding:6px 8px;font-weight:700;color:var(--muted);font-size:12px;">達成度</td>
            <td style="padding:6px 8px;font-family:monospace;font-weight:800;text-align:center;${prepRate !== '—' && parseFloat(prepRate) >= 100 ? 'color:var(--success);' : ''}">${prepRate}${prepRate !== '—' ? '%' : ''}</td>
            <td style="padding:6px 8px;font-family:monospace;font-weight:800;text-align:center;${prodRate !== '—' && parseFloat(prodRate) >= 100 ? 'color:var(--success);' : ''}">${prodRate}${prodRate !== '—' ? '%' : ''}</td>
            <td style="padding:6px 8px;text-align:center;color:var(--muted);">—</td>
            <td style="padding:6px 8px;text-align:center;color:var(--muted);">—</td>
          </tr>
        </tfoot>
      </table>
      </div>
    </div>
  `;
}

function countSteps(o) {
  // 新格式 stepEntries + 舊格式 stepXAt
  const oldCount = ['step1At','step2At','step3At','step4At','step5At','step6At','step7At'].filter(k => o[k]).length;
  const newCount = (o.stepEntries || []).filter(e => ['1','2','3','4','5','6','7','8','40','41'].includes(e.stepNo)).length;
  return oldCount + newCount;
}
function hasAnyActivity(o) {
  return countSteps(o) > 0 || (o.stepEntries || []).length > 0;
}

function buildTimeline(o, isAdmin) {
  const items = [];
  const stepNameMap = {};
  STEP_LABELS.forEach(s => stepNameMap[s.key] = s.label);

  // 舊格式 stepXAt — step 11 帶上備註（含/不含附屬設備 + 主/附獨立運作）
  STEP_LABELS.forEach(s => {
    if (o[s.key]) {
      let label = s.label;
      if (s.key === 'step11At' && o.step11Note) {
        label += '（' + escapeHtml(o.step11Note) + '）';
      }
      items.push({ time: new Date(o[s.key]), label, type: 'step', entryId: null });
    }
  });

  // 新格式 stepEntries（日誌式，可多次）
  (o.stepEntries || []).forEach(e => {
    if (e.stepNo === '30') {
      const suffix = (e.isManual ? '（補登）' : '');
      items.push({ time: new Date(e.recordedAt), label: icon('clipboard', 13) + ' 更換規格：' + escapeHtml(e.note || '') + suffix, type: 'spec-change', entryId: e.id });
      return;
    }
    const suffix = (e.isManual ? '（補登）' : '');
    // stepNo 40 / 41：顯示實際名稱
    if (e.stepNo === '40' || e.stepNo === '41') {
      const stateName = e.stepNo === '40' ? '生產準備' : '生產開始';
      const noteTxt = e.note ? '（' + e.note + '）' : '';
      items.push({ time: new Date(e.recordedAt), label: stateName + noteTxt + suffix, type: 'step', entryId: e.id });
      return;
    }
    const labelMap = {'1':'原料準備與設置','2':'模刀具準備與安裝','3':'試模與規格品質確認','4':'穩定連續生產-無中斷','5':'穩定連續生產-中斷調整','8':'穩定連續生產-中斷多次','6':'後工程接續生產','7':'其他作業','21':'設備啓動準備','22':'生產準備完成','23':'生產無工令'};
    const name = labelMap[e.stepNo] || ('工序 ' + e.stepNo);
    items.push({ time: new Date(e.recordedAt), label: name + suffix, type: 'step', entryId: e.id });
  });

  // 暫停事件
  const pauseEvents = [
    ...((o.pause12 && o.pause12.history) || []).map(e => Object.assign({}, e, { pauseType: '12', pauseLabel: '正常暫停' })),
    ...((o.pause13 && o.pause13.history) || []).map(e => Object.assign({}, e, { pauseType: '13', pauseLabel: '異常停止' })),
  ];
  pauseEvents.forEach(e => {
    const note = e.note ? '（' + escapeHtml(e.note) + '）' : '';
    const ico = e.pauseType === '13' ? icon('alert', 13) : icon('pause', 13);
    items.push({
      time: new Date(e.startAt),
      label: ico + ' ' + e.pauseLabel + note,
      type: e.pauseType === '13' ? 'abnormal' : 'pause',
    });
    if (e.endAt) {
      const dur = e.duration ? fmtDur(e.duration) : '';
      items.push({
        time: new Date(e.endAt),
        label: icon('play', 13) + ' 恢復生產' + (dur ? '（暫停 ' + dur + '）' : ''),
        type: 'resume',
      });
    }
  });

  items.sort((a, b) => a.time - b.time);

  if (items.length === 0) return '<li><div class="tl-dot"></div><div class="tl-label" style="color:var(--muted);">尚未開始</div></li>';

  const lastIdx = o.step11At ? -1 : items.length - 1;

  return items.map((it, i) => {
    const isCurrent = i === lastIdx && it.type === 'step';
    let cls = 'done';
    if (isCurrent) cls = 'current';
    else if (it.type === 'pause') cls = 'done pause-event';
    else if (it.type === 'abnormal') cls = 'done abnormal-event';
    else if (it.type === 'resume') cls = 'done resume-event';
    else if (it.type === 'spec-change') cls = 'spec-change';

    // 時間格式：MM/DD HH:MM（+與上一筆的時間差）
    const pad = n => String(n).padStart(2, '0');
    const d = it.time;
    const dateStr = pad(d.getMonth()+1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    let diffStr = '';
    if (i > 0) {
      const diffSec = Math.round((it.time - items[i-1].time) / 1000);
      if (diffSec >= 0) {
        const dm = Math.floor(diffSec / 60);
        const dh = Math.floor(dm / 60);
        if (dh > 0) diffStr = `（+${dh}時${dm % 60}分）`;
        else if (dm > 0) diffStr = `（+${dm}分）`;
        else diffStr = `（+${diffSec}秒）`;
      }
    }

    // 跨日判斷：與上一筆不同天就插紅線
    let dayDivider = '';
    let isNextDay = false;
    if (i > 0) {
      const prev = items[i-1].time;
      if (d.getFullYear() !== prev.getFullYear() || d.getMonth() !== prev.getMonth() || d.getDate() !== prev.getDate()) {
        isNextDay = true;
        dayDivider = `<li class="day-divider"><span>── 隔日生產 ${pad(d.getMonth()+1)}/${pad(d.getDate())} ──</span></li>`;
      }
    }
    let displayLabel = it.label;
    if (isNextDay) {
      diffStr = '';
      if (it.type === 'resume') displayLabel = '隔日恢復生產';
    }

    const delBtn = isAdmin && it.entryId ? ` <button data-del-entry="${it.entryId}" data-order="${escapeHtml(o.orderNo)}" style="background:var(--brand);color:#fff;border:none;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer;margin-left:6px;">✕</button>` : '';
    return dayDivider + `
      <li class="${cls}">
        <div class="tl-dot"></div>
        <div class="tl-time">${dateStr}<span style="font-size:10px;color:var(--muted);font-weight:500;">${diffStr}</span></div>
        <div class="tl-label">${displayLabel}${delBtn}</div>
      </li>
    `;
  }).join('');
}

// 設備參數展開
const RT_EP_FIELDS = [
  ['paramFileName', '設備參數檔名'],
  ['paramFileAttr', '參數檔案屬性'],
  ['moldSpec', '模具規格'],
  ['machineSPM', '機器SPM'],
  ['bladeCount', '生產刀數'],
  ['feedSetting', '送料設定'],
  ['cutterStroke', '大刀座行程'],
  ['strokeUpdateFreq', '行程更新頻度'],
];
function renderRtEquipment(ep, orderNo) {
  const fields = RT_EP_FIELDS.map(([k, label]) => {
    const v = ep ? (ep[k] ?? '') : '';
    const isNum = (k === 'machineSPM' || k === 'bladeCount');
    const type = isNum ? 'number' : 'text';
    const step = (k === 'machineSPM') ? ' step="0.1" min="0"' : (isNum ? ' min="0"' : '');
    return `<div style="display:grid;grid-template-columns:88px 1fr;align-items:center;gap:6px;padding:3px 0;">
      <label style="color:var(--muted);font-size:11px;">${label}</label>
      <input type="${type}"${step} data-ep-field="${k}" value="${escapeHtml(String(v))}" maxlength="200" style="padding:6px 8px;font-size:12px;border:1px solid var(--border);border-radius:6px;width:100%;background:#fff;">
    </div>`;
  }).join('');
  const placeholder = ep ? '' : '<div style="color:var(--muted);font-size:11px;text-align:center;padding:4px 0 6px;">尚未上傳，請填寫後儲存</div>';
  return `
    <div data-ep-order="${escapeHtml(orderNo)}">
      ${placeholder}
      ${fields}
      <button onclick="saveRtEquipment('${escapeHtml(orderNo)}', this)" style="margin-top:8px;padding:8px 12px;background:var(--brand);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;width:100%;">儲存設備參數</button>
      <div class="ep-result" style="font-size:11px;text-align:center;margin-top:4px;min-height:14px;"></div>
    </div>
  `;
}
async function saveRtEquipment(orderNo, btn) {
  const wrap = btn.closest('[data-ep-order]');
  if (!wrap) return;
  const body = {};
  wrap.querySelectorAll('[data-ep-field]').forEach(input => {
    const k = input.dataset.epField;
    let v = (input.value || '').trim();
    if (v === '') { body[k] = null; return; }
    if (k === 'machineSPM' || k === 'bladeCount') {
      const n = Number(v);
      body[k] = Number.isFinite(n) ? n : null;
    } else {
      body[k] = v;
    }
  });
  btn.disabled = true;
  const r = await api('/api/equipment-params/' + encodeURIComponent(orderNo), {
    method: 'POST',
    body,
  });
  btn.disabled = false;
  const res = wrap.querySelector('.ep-result');
  if (!r.ok) {
    res.style.color = 'var(--brand)';
    res.textContent = '✗ ' + (r.error || '儲存失敗');
    return;
  }
  res.style.color = 'var(--success)';
  res.textContent = '✓ 已儲存';
  toast('已儲存設備參數', 'success');
}
async function toggleRtEquipment(orderNo, btn) {
  const wrap = document.querySelector('.rt-equipment-' + CSS.escape(orderNo));
  if (!wrap) return;
  const showing = wrap.style.display !== 'none';
  wrap.style.display = showing ? 'none' : 'block';
  if (showing) return;
  if (wrap.dataset.loaded) return;
  wrap.dataset.loaded = '1';
  wrap.innerHTML = '<div style="color:var(--muted);font-size:12px;">載入中...</div>';
  const r = await api('/api/equipment-params/' + encodeURIComponent(orderNo));
  if (!r.ok) {
    wrap.innerHTML = '<div style="color:var(--brand);font-size:12px;">' + (r.error || '載入失敗') + '</div>';
    return;
  }
  wrap.innerHTML = renderRtEquipment(r.data.equipmentParam, orderNo);
}

initDropdownMenu();
loadOrders();
setInterval(loadOrders, 30000);

</script>
